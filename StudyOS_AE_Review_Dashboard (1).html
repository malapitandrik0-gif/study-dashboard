<style>
:root{--bg:#fff;--fg:#111;--muted:#6f6f6f;--line:#dedede;--soft:#f5f5f5;--dark:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:19px;letter-spacing:-.04em;padding:0 10px 25px}.logo span{font-weight:400;color:var(--muted)}
nav button{width:100%;text-align:left;border:0;background:transparent;padding:11px 10px;border-radius:8px;margin:2px 0;color:#333}
nav button.active,nav button:hover{background:#111;color:#fff}.side-note{position:absolute;bottom:20px;left:28px;right:20px;color:var(--muted);font-size:11px;line-height:1.5}
main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;background:rgba(255,255,255,.95);z-index:5}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:9px 12px;border-radius:9px;width:min(410px,45vw)}.search input{border:0;outline:0;width:100%;background:transparent}
.content{padding:34px;max-width:1350px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}h1{font-size:34px;letter-spacing:-.05em;margin:7px 0 10px}h2{font-size:22px;letter-spacing:-.03em;margin:0 0 15px}h3{font-size:16px;margin:0 0 7px}.sub{color:var(--muted);max-width:760px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:17px}.stat b{font-size:27px;letter-spacing:-.04em}.stat small{display:block;color:var(--muted);margin-top:3px}
.progress{height:7px;background:#eee;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#111;width:0}.bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:12px;padding:17px;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:0 5px 20px rgba(0,0,0,.05)}.card p{font-size:13px;line-height:1.55;color:#444}.tag{display:inline-block;font-size:10px;border:1px solid #ccc;border-radius:20px;padding:4px 7px;margin:0 4px 7px 0;color:#555}
.btn{border:1px solid #222;background:#111;color:#fff;border-radius:8px;padding:9px 12px}.btn.ghost{background:#fff;color:#111;border-color:var(--line)}.btn.small{font-size:12px;padding:7px 9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar select{border:1px solid var(--line);padding:9px;border-radius:8px;background:#fff}
.topic-list{display:grid;gap:9px}.topic{border:1px solid var(--line);border-radius:10px;padding:15px;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}.topic.done{background:#fafafa}.topic.done .title{text-decoration:line-through;color:#777}.check{width:20px;height:20px;accent-color:#111}.title{font-weight:650}.meta{font-size:11px;color:var(--muted);margin-top:4px}.topic-actions{display:flex;gap:7px}
.detail{max-width:900px}.detail-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.detail .box{border:1px solid var(--line);border-radius:12px;padding:19px;margin-top:14px}.detail p,.detail li{line-height:1.65;color:#333;font-size:14px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f6f6f6;border:1px solid var(--line);padding:11px;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-card{background:#fff;border-radius:14px;width:min(760px,100%);max-height:85vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:15px}.close{border:0;background:#eee;border-radius:50%;width:30px;height:30px}
.quiz-q{border-top:1px solid var(--line);padding:18px 0}.quiz-q p{margin:0 0 10px;font-weight:650}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:10px;border-radius:8px;margin:6px 0}.option:hover{border-color:#111}.option.correct{background:#111;color:#fff}.option.wrong{background:#eee;text-decoration:line-through}
.empty{border:1px dashed #ccc;padding:35px;text-align:center;color:var(--muted);border-radius:12px}
@media(max-width:950px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side-note{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.top{padding:0 18px}.content{padding:24px 18px}}
@media(max-width:600px){.cards,.grid{grid-template-columns:1fr}.search{width:55vw}.top{gap:8px}.topic{grid-template-columns:28px 1fr}.topic-actions{grid-column:2}}
</style>

<script>
const DATA = {"groups": [{"id": "ae4-m1", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "source": "AE/AE4/AE4_Module1_Management_Science.docx", "topics": [["1.1 What is Management Science?", "Management Science applies mathematics, statistics, data, and analytical models to managerial decision-making. It turns business problems into structured models so managers can compare alternatives and choose effective solutions."], ["1.2 Historical Background", "Management Science developed from quantitative methods used in military operations and expanded into business decision-making through operations research, computing, and modern analytics."], ["1.3 Management Science vs. Operations Research", "The terms overlap heavily. Operations Research traditionally emphasizes optimization and operational decisions, while Management Science is often used more broadly for quantitative decision support in management."], ["2.1 Characteristics of Management Science", "Key characteristics include a systematic approach, quantitative analysis, model building, problem orientation, interdisciplinary thinking, and the use of data to support decisions."], ["2.2 Scope of Management Science", "Applications include production, inventory, scheduling, transportation, finance, marketing, project management, resource allocation, and other decisions involving limited resources."], ["2.3 Advantages of Using Management Science", "It improves consistency, makes assumptions explicit, compares alternatives objectively, and helps managers use scarce resources efficiently."], ["3.1 The Scientific Approach to Problem-Solving", "Typical steps are identifying the problem, defining objectives and constraints, collecting data, developing a model, solving it, validating results, implementing the decision, and monitoring outcomes."], ["3.2 Types of Models in Management Science", "Models may be physical, analog, or mathematical. Mathematical models represent relationships among decision variables, parameters, objectives, and constraints."], ["3.3 Model Components", "Important components include decision variables, parameters, objective functions, constraints, and assumptions. Correct model formulation is critical before solving."], ["3.4 Illustrative Example: Simple Model Formulation", "A basic model translates a real business decision into variables, an objective to maximize/minimize, and constraints representing scarce resources or requirements."], ["4.1 Major Quantitative Techniques", "Common techniques include linear programming, transportation models, assignment models, inventory models, queuing, forecasting, simulation, network models, and decision analysis."], ["4.2 Summary of Techniques and Applications", "Choose a technique based on the decision structure: optimization for allocation, forecasting for prediction, simulation for complex uncertainty, and network methods for connected activities."], ["4.3 Management Science and the Accountancy Profession", "Accountants can use analytical models for budgeting, cost control, forecasting, risk analysis, resource allocation, and evidence-based managerial decisions."]]}, {"id": "ae4-m2", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx", "topics": [["1.1 What is Linear Programming?", "Linear Programming (LP) is an optimization technique used to maximize or minimize a linear objective function subject to linear constraints and non-negativity restrictions."], ["1.2 Components of an LP Model", "Core components are decision variables, objective function, constraints, and non-negativity restrictions. Parameters are the numerical coefficients used in the model."], ["1.3 Steps in Formulating LP Models", "Identify decision variables, state the objective, translate resource/requirement limits into constraints, add non-negativity conditions, and check whether the model reflects the real problem."], ["1.4 Formulating Maximization Problems", "Maximization models typically maximize profit, contribution, output, or another benefit subject to limited resources."], ["1.5 Formulating Minimization Problems", "Minimization models seek the lowest cost, time, distance, or other undesirable quantity while meeting required constraints."], ["2.1 Requirements and Steps of the Graphical Method", "The graphical method is mainly used for two-variable LPs. Plot constraints, identify the feasible region, locate corner points, and evaluate the objective function."], ["2.2 The Corner-Point Method", "For a linear objective over a polygonal feasible region, an optimum occurs at a corner point when a finite optimum exists. Evaluate the objective at feasible corners."], ["2.3 The Iso-Profit / Iso-Cost Line Method", "Move a line representing a constant objective value in the improving direction until it reaches the last feasible point or edge."], ["2.4 Solving a Minimization Problem Graphically", "Graph constraints, identify the feasible region, determine candidate corner points, then choose the feasible point with the smallest objective value."], ["2.5 Sensitivity Range (Ranging Analysis)", "Sensitivity analysis examines how changes in model parameters can affect the optimal solution without completely re-solving the model."], ["2.6 Special Cases in Linear Programming", "Infeasibility means no feasible solution; unboundedness means the objective can improve without a finite limit; multiple optima occur when more than one feasible point gives the same optimal objective value."]]}, {"id": "ae4-m3", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx", "topics": [["1.1 From a General LP Model to Standard Form", "Standard form prepares an LP for the Simplex Method by expressing constraints and variables in a consistent algebraic form, including slack, surplus, and artificial variables when required."], ["1.2 The Simplex Tableau", "The tableau organizes coefficients, right-hand sides, basic variables, and the objective row so each iteration can be performed systematically."], ["1.3 Pivot Operations", "A pivot changes the basis by selecting an entering variable and a leaving variable, then using row operations to make the pivot column suitable for the new basic solution."], ["1.4 The Big-M Method", "The Big-M method introduces artificial variables and assigns a very large penalty to them in the objective function so the final solution removes artificial variables when a feasible optimum exists."], ["1.5 The Two-Phase Method", "Phase I finds a feasible basis by minimizing the sum of artificial variables; Phase II optimizes the original objective using the feasible basis."], ["2.1 The Concept of Duality", "Every LP has an associated dual problem. The primal and dual provide alternative views of the same optimization structure and have linked optimal objective values under standard conditions."], ["2.2 Formulating the Dual Problem", "Dual construction systematically switches the roles of constraints and variables, with coefficients, inequality directions, and objective orientation determined by the primal form."], ["2.3 Economic Interpretation: Shadow Prices", "A shadow price measures the marginal value of relaxing a binding resource constraint within the valid sensitivity range."], ["2.4 Right-Hand-Side (RHS) Ranging", "RHS sensitivity asks how much a constraint's resource availability can change while the current basis remains optimal."], ["2.5 Objective Function Coefficient Ranging", "Coefficient sensitivity determines the range over which objective coefficients can change without changing the current optimal basis."], ["3.1 Formulation of the Transportation Problem", "Transportation models allocate quantities from sources to destinations while minimizing shipping cost or optimizing another linear objective under supply and demand constraints."], ["3.2 Finding an Initial Feasible Solution", "An initial feasible transportation solution can be generated using methods such as Northwest Corner, Least Cost, or Vogel's Approximation Method."], ["3.3 The MODI (Modified Distribution) Method", "MODI evaluates a transportation solution using row and column potentials and opportunity costs to determine whether an improvement is possible and to move toward optimality."]]}, {"id": "ae11-m1", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx", "topics": [["1.1 Definition of Managerial Economics", "Managerial Economics applies economic theory and quantitative methods to business and firm-level decision-making, especially decisions involving scarce resources, pricing, production, and strategy."], ["1.2 Nature of Managerial Economics", "It is applied, decision-oriented, and interdisciplinary. It uses economic reasoning together with mathematics, statistics, accounting, finance, and management concepts."], ["1.3 Scope of Managerial Economics", "The scope includes demand analysis, production and cost decisions, pricing, market structure, profit planning, risk, competition, and government policy affecting firms."], ["2.1 Relationship with Other Fields", "Managerial economics connects economics with accounting, finance, statistics, mathematics, operations research, marketing, and management."], ["2.2 Managerial Economics vs. Traditional Economics", "Traditional economics develops broader theories about consumers, firms, and economies; managerial economics applies relevant theory directly to practical business decisions."], ["3.1 Meaning of Profit", "Profit is the return remaining after costs are considered. Economic profit differs from accounting profit because it recognizes opportunity costs."], ["3.2 Theories of Profit", "Profit can be explained through ideas such as risk-bearing, uncertainty, innovation, monopoly power, and dynamic change."], ["3.3 Functions of Profit", "Profit can reward innovation and risk-taking, signal efficient resource use, provide funds for growth, and motivate firms."], ["3.4 Profit Maximization", "The traditional rule is to choose output where marginal revenue equals marginal cost (MR = MC), subject to the relevant conditions."], ["3.5 Alternative Objectives of the Firm", "Firms may also pursue sales growth, market share, managerial utility, survival, stakeholder goals, or satisfactory rather than maximum profit."], ["4.1 Definition of a Business Firm", "A firm is an organization that combines resources to produce goods or services and makes decisions about production, pricing, and resource use."], ["4.2 Types of Business Firms", "Firms may be organized under different ownership structures, such as sole proprietorships, partnerships, corporations, and cooperatives."], ["4.3 Objectives of a Business Firm", "Objectives can include profit, growth, survival, market share, efficiency, innovation, and stakeholder-related goals."], ["4.4 The Firm in the Economic System", "Firms transform inputs into outputs and interact with households, markets, government, and other institutions through resource and product markets."]]}, {"id": "ae11-m2", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx", "topics": [["1.1 Demand, Supply, and the Market Mechanism", "Demand describes quantities buyers are willing and able to buy; supply describes quantities sellers are willing and able to offer. Their interaction helps determine market price and quantity."], ["1.2 Elasticities and Revenue Management", "Elasticity measures responsiveness, such as percentage change in quantity divided by percentage change in price. Price elasticity helps managers anticipate revenue effects of price changes."], ["1.3 Government Intervention: Price Controls, Taxes, and Subsidies", "Price ceilings can create shortages when binding; price floors can create surpluses when binding. Taxes create a wedge between buyer and seller prices, while subsidies encourage activity."], ["2.1 Consumer Preferences and Utility Maximization", "Consumers allocate limited income across goods to maximize satisfaction subject to a budget constraint. Marginal utility and marginal utility per peso are key decision concepts."], ["2.2 Market Demand Estimation", "Demand estimation uses economic theory and data to quantify how quantity demanded responds to price, income, advertising, competitor actions, and other determinants."], ["2.3 Behavioral Economics", "Behavioral economics incorporates psychological factors and systematic biases that can cause actual decisions to differ from the fully rational-agent model."], ["3.1 Production Functions and Efficiency", "A production function relates inputs to maximum attainable output. Managers analyze productivity and the efficient combination of labor, capital, and other inputs."], ["3.2 Short-Run vs. Long-Run Costs", "In the short run, at least one input is fixed; in the long run, all inputs can be varied. Cost curves and marginal cost guide production decisions."], ["3.3 Economies of Scale", "Economies of scale occur when long-run average cost falls as output increases. Diseconomies occur when average cost rises after a certain scale."], ["3.4 The Principal-Agent Problem", "The principal-agent problem arises when one party delegates work to another whose incentives or information may differ. Monitoring, contracts, incentives, and governance can reduce the problem."]]}, {"id": "ae11-m3", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx", "topics": [["1.1 Perfect Competition", "Perfect competition features many buyers and sellers, homogeneous products, free entry and exit, and firms that are price takers."], ["1.2 Monopoly", "A monopoly is a market with a single dominant seller protected by significant barriers to entry. The firm has market power and chooses output and price subject to demand."], ["1.3 Monopolistic Competition", "Many firms sell differentiated products and entry is relatively easy. Firms have some pricing power because products are not identical."], ["1.4 Oligopoly and Strategic Interactions", "An oligopoly has a small number of interdependent firms. Each firm's decision can affect rivals, so strategic behavior is central."], ["2.1 Nash Equilibrium", "A Nash equilibrium occurs when each player's strategy is a best response to the strategies of the others, so no player benefits from changing strategy alone."], ["2.2 Price Discrimination", "Price discrimination means charging different prices for the same or similar product when differences are not fully explained by cost, often based on willingness to pay."], ["2.3 Two-Part Pricing", "A two-part tariff combines an entry or fixed fee with a per-unit charge to extract more consumer surplus under suitable conditions."], ["2.4 Commodity Bundling", "Bundling sells products together as a package. It can increase willingness to buy and improve revenue when consumer valuations differ across products."], ["2.5 Peak-Load Pricing", "Peak-load pricing charges higher prices during periods of high demand or capacity pressure and lower prices during off-peak periods."], ["3.1 Economics of Information", "Information has economic value because better information can improve decisions and reduce uncertainty, but obtaining information can also be costly."], ["3.2 Asymmetric Information", "Asymmetric information occurs when one party has more relevant information than another. Common problems include adverse selection and moral hazard."], ["3.3 Externalities and Public Goods", "Externalities are spillover effects on third parties. Public goods are generally non-rival and non-excludable, creating challenges for private provision."], ["4.1 Government Regulation", "Regulation can address market failures, consumer protection, competition, information problems, and external costs, but regulation also has costs and possible unintended effects."], ["4.2 Antitrust Policy", "Antitrust policy seeks to protect competition by addressing conduct or structures that substantially harm competitive markets."], ["4.3 Role of Accounting in Regulatory Compliance", "Accounting systems support compliance by producing reliable records, disclosures, controls, and evidence needed for regulatory and governance requirements."]]}, {"id": "ae12-m1", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx", "topics": [["1.1 Economic Development", "Economic development is broader than increases in output. It includes improvements in living standards, health, education, capabilities, institutions, and opportunities."], ["1.2 Economic Growth", "Economic growth is an increase in the production of goods and services over time, commonly measured using real GDP or real GDP per capita."], ["1.3 Development Indicators: GDP, GNI & Per Capita Income", "GDP measures production within a country; GNI adjusts for net income from abroad; per-capita measures divide an aggregate by population and help compare average income."], ["1.4 Human Development Index (HDI)", "HDI summarizes key dimensions of human development, including health, education, and standard of living. It is broader than an income-only measure."], ["1.5 Inequality and the Gini Coefficient", "The Gini coefficient summarizes inequality, with higher values generally indicating greater inequality. The Lorenz curve provides a graphical representation of income distribution."], ["1.6 Sustainability and the SDGs", "Sustainable development seeks to improve welfare while preserving the ability of future generations to meet their needs. The UN Sustainable Development Goals provide a global framework for development priorities."]]}, {"id": "ae12-m2", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx", "topics": [["1.1 Common Characteristics of Developing Nations", "Developing economies may face lower average incomes, structural transformation, infrastructure gaps, informal employment, inequality, institutional constraints, and limited access to productive opportunities."], ["1.2 The Convergence Debate", "Convergence asks whether poorer economies tend to catch up with richer economies. Conditional convergence emphasizes that countries converge toward their own steady states given differences in savings, population growth, technology, institutions, and human capital."], ["1.3 East Asian Miracle vs. Philippine Experience", "East Asian high-growth economies are often associated with export orientation, investment in human capital, industrial policy, macroeconomic stability, and institutional capacity. The Philippine experience reflects a more uneven structural transformation and growth path."], ["2.1 Rostow's Stages of Growth", "Rostow describes development as stages: traditional society, preconditions for take-off, take-off, drive to maturity, and age of high mass consumption."], ["2.2 Harrod-Domar Model", "The Harrod-Domar framework links growth to savings and investment, emphasizing the role of capital accumulation and the capital-output relationship."], ["2.3 Structural-Change Models", "Structural-change approaches explain development through shifts from low-productivity traditional agriculture toward higher-productivity modern industry and services."], ["2.4 Lewis Two-Sector Model", "The Lewis model describes a traditional rural sector with surplus labor and a modern capitalist sector that absorbs labor as development proceeds, with capital accumulation supporting expansion."]]}, {"id": "ae12-m3", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx", "topics": [["1.1 Lorenz Curve and Gini Coefficient", "The Lorenz curve compares cumulative population shares with cumulative income shares. The Gini coefficient summarizes the degree of inequality represented by the distribution."], ["1.2 Poverty and Social Welfare", "Poverty involves inadequate resources or capabilities to meet basic needs. Analysis distinguishes absolute/poverty-line approaches from broader measures of deprivation and social welfare."], ["2.1 The Demographic Transition", "The demographic transition describes movement from high birth and death rates toward lower birth and death rates as development, health, education, and urbanization change."], ["2.2 Population Growth and Economic Development", "Population growth can expand labor supply and markets, but rapid growth can also strain education, health, infrastructure, jobs, and natural resources when productive capacity lags."], ["2.3 The O-Ring Theory of Economic Development", "The O-Ring model emphasizes that production tasks can be strongly complementary: a failure in one critical task can reduce the value of the entire production process, making skills and matching important."], ["3.1 Health and Education as Integrated Investments", "Health and education build human capital, raise productivity, expand capabilities, and can reinforce one another over the life cycle."], ["3.2 Gender Gap in Development", "Gender gaps in education, health, labor-force participation, earnings, assets, and decision-making can reduce economic potential. Closing gaps can improve both equity and productivity."]]}, {"id": "ae10-u1", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit I — Corporate Governance (Chapters 1–4)", "source": "AE/AE10/AE-10-chapter-1-5.docx", "topics": [["Chapter 1 — Introduction to Corporate Governance", "Corporate governance concerns how organizations are directed and controlled. Core ideas include accountability, transparency, responsibility, fairness, stakeholder interests, and effective oversight."], ["Chapter 2 — Governance Responsibilities and Accountabilities", "Boards, management, shareholders, and other stakeholders have distinct responsibilities. Good governance requires clear roles, oversight, accountability, and mechanisms for addressing conflicts of interest."], ["Chapter 3 — SEC Code of Corporate Governance for Publicly-Listed Companies", "The SEC governance framework emphasizes board responsibility, disclosure, transparency, risk oversight, shareholder rights, and systems that support ethical and accountable corporate management."], ["Chapter 4 — SEC Code of Corporate Governance, Continued", "Continued governance guidance focuses on board practices, committees, control and risk systems, disclosures, stakeholder relations, and accountability mechanisms."]]}, {"id": "ae10-u2", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "source": "AE/AE10/AE-10-chapter-1-5.docx", "topics": [["Chapter 5 — Introduction to Ethics", "Ethics concerns principles used to judge right and wrong conduct. Ethical reasoning helps individuals and organizations evaluate decisions beyond legality or short-term self-interest."], ["Chapter 6 — Business Ethics", "Business ethics applies ethical principles to business decisions, relationships, policies, and organizational conduct. It connects values with responsible business practice."], ["Chapter 7 — Common Unethical Practices of Business Establishments", "Unethical practices may include fraud, corruption, misleading conduct, conflicts of interest, abuse of authority, and other actions that violate trust or professional standards."], ["Chapter 8 — Ethical Dilemma", "An ethical dilemma occurs when important values, duties, or interests conflict. A structured approach identifies stakeholders, facts, alternatives, consequences, and ethical principles before deciding."], ["Chapter 9 — Advocacy Against Corruption", "Anti-corruption advocacy promotes integrity, transparency, accountability, reporting mechanisms, and organizational cultures that discourage bribery and abuse of power."], ["Chapter 10 — Initiatives to Improve Business Ethics and Reduce Corruption", "Organizations can improve ethics through codes of conduct, leadership example, training, whistleblowing channels, internal controls, monitoring, sanctions, transparency, and continuous evaluation."]]}], "topics": [{"id": "ae4-m1-1-1-what-is-management-science", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "1.1 What is Management Science?", "summary": "Management Science applies mathematics, statistics, data, and analytical models to managerial decision-making. It turns business problems into structured models so managers can compare alternatives and choose effective solutions.", "excerpt": "Management Science (MS), also known as Operations Research (OR), is a discipline that uses scientific and mathematical methods to help managers make better decisions. It applies analytical techniques to solve complex organizational problems and optimize the use of limited resources. Management Science is defined from several perspectives:", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-1-2-historical-background", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "1.2 Historical Background", "summary": "Management Science developed from quantitative methods used in military operations and expanded into business decision-making through operations research, computing, and modern analytics.", "excerpt": "Management Science has its roots in military planning and industrial engineering. Below is a timeline of its major milestones:", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-1-3-management-science-vs-operations-research", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "1.3 Management Science vs. Operations Research", "summary": "The terms overlap heavily. Operations Research traditionally emphasizes optimization and operational decisions, while Management Science is often used more broadly for quantitative decision support in management.", "excerpt": "The terms Management Science and Operations Research are often used interchangeably, though slight distinctions exist: In Philippine higher education, the two terms are used interchangeably in the BSA curriculum.", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-2-1-characteristics-of-management-science", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "2.1 Characteristics of Management Science", "summary": "Key characteristics include a systematic approach, quantitative analysis, model building, problem orientation, interdisciplinary thinking, and the use of data to support decisions.", "excerpt": "Management Science is distinguished by the following defining characteristics:", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-2-2-scope-of-management-science", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "2.2 Scope of Management Science", "summary": "Applications include production, inventory, scheduling, transportation, finance, marketing, project management, resource allocation, and other decisions involving limited resources.", "excerpt": "Management Science is applied across all functional areas of business: Production and Operations – Scheduling, inventory management, quality control, capacity planning. Finance and Accounting – Capital budgeting, portfolio optimization, financial risk analysis, cost allocation. Marketing – Sales forecasting, territory assignment, advertising budget allocation. Human Resources – Workforce scheduling, job assignment, training program optimization. Logistics and Supply Chain – Transportation routing, warehouse location, distribution network design. Project Management – Planning and controlling complex projects using PERT/CPM. Healthcare – Patient scheduling, hospital resource allocation, medical supply chains.", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-2-3-advantages-of-using-management-science", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "2.3 Advantages of Using Management Science", "summary": "It improves consistency, makes assumptions explicit, compares alternatives objectively, and helps managers use scarce resources efficiently.", "excerpt": "Provides structured, objective analysis free from personal bias. Enables evaluation of multiple alternatives simultaneously. Identifies optimal or near-optimal solutions to complex problems. Quantifies trade-offs and makes them explicit for decision-makers. Supports long-term strategic planning through forecasting and simulation. Improves efficiency and reduces costs in organizational operations.", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-3-1-the-scientific-approach-to-problem-solving", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "3.1 The Scientific Approach to Problem-Solving", "summary": "Typical steps are identifying the problem, defining objectives and constraints, collecting data, developing a model, solving it, validating results, implementing the decision, and monitoring outcomes.", "excerpt": "Management Science follows a structured, logical process when addressing organizational problems. This process ensures that decisions are based on evidence, analysis, and valid assumptions rather than intuition alone.", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-3-2-types-of-models-in-management-science", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "3.2 Types of Models in Management Science", "summary": "Models may be physical, analog, or mathematical. Mathematical models represent relationships among decision variables, parameters, objectives, and constraints.", "excerpt": "Models are simplified representations of reality. In Management Science, several types are used:", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-3-3-model-components", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "3.3 Model Components", "summary": "Important components include decision variables, parameters, objective functions, constraints, and assumptions. Correct model formulation is critical before solving.", "excerpt": "Every mathematical model in Management Science contains the following components: Decision Variables – The unknowns to be determined (e.g., quantity to produce, number of workers to assign). Objective Function – The mathematical expression to be maximized (e.g., profit) or minimized (e.g., cost). Constraints – Restrictions or limitations on the decision variables (e.g., resource limits, capacity limits). Parameters – Fixed values or constants that are known inputs to the model (e.g., unit cost, demand rate). Non-negativity Conditions – Requirement that decision variables be zero or positive (logical physical constraint).", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-3-4-illustrative-example-simple-model-formulation", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "3.4 Illustrative Example: Simple Model Formulation", "summary": "A basic model translates a real business decision into variables, an objective to maximize/minimize, and constraints representing scarce resources or requirements.", "excerpt": "", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-4-1-major-quantitative-techniques", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "4.1 Major Quantitative Techniques", "summary": "Common techniques include linear programming, transportation models, assignment models, inventory models, queuing, forecasting, simulation, network models, and decision analysis.", "excerpt": "Management Science employs a rich toolkit of quantitative methods. The major techniques studied in AE 4 are presented below: A. Linear Programming (LP) A mathematical technique for optimizing (maximizing or minimizing) a linear objective function subject to linear constraints. Used in production planning, resource allocation, diet problems, and blending. Key methods: Graphical Method, Simplex Method, Big-M Method, Two-Phase Method. B. Transportation and Assignment Models Special LP models used to minimize transportation costs across supply-demand networks (Transportation Model) and to optimally assign tasks to workers or machines (Assignment Model). Key methods: Northwest Corner, Least Cost, Vogel's Approximation, MODI Method, Hungarian Method. C. Network Models", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-4-2-summary-of-techniques-and-applications", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "4.2 Summary of Techniques and Applications", "summary": "Choose a technique based on the decision structure: optimization for allocation, forecasting for prediction, simulation for complex uncertainty, and network methods for connected activities.", "excerpt": "", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m1-4-3-management-science-and-the-accountancy-profession", "subject": "AE 4 — Management Science", "module": "Module 1 — Introduction to Management Science", "title": "4.3 Management Science and the Accountancy Profession", "summary": "Accountants can use analytical models for budgeting, cost control, forecasting, risk analysis, resource allocation, and evidence-based managerial decisions.", "excerpt": "Management Science is closely aligned with the knowledge and skills required of professional accountants: Cost Accounting – LP and inventory models help minimize production and carrying costs. Managerial Accounting – Decision analysis and sensitivity analysis support management reporting and budgeting. Auditing – Network models and scheduling techniques assist in audit planning and resource allocation. Financial Management – Simulation and decision trees are used in capital budgeting under uncertainty. Taxation – Optimization models support tax planning and compliance scheduling. Advisory Services – CPAs in management consulting use MS tools to improve client operations.", "source": "AE/AE4/AE4_Module1_Management_Science.docx"}, {"id": "ae4-m2-1-1-what-is-linear-programming", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "1.1 What is Linear Programming?", "summary": "Linear Programming (LP) is an optimization technique used to maximize or minimize a linear objective function subject to linear constraints and non-negativity restrictions.", "excerpt": "Linear programming (LP) is a mathematical technique used to determine the optimal (best possible) allocation of limited resources among competing activities, in order to maximize an objective such as profit, or minimize an objective such as cost. The word \"linear\" means that all mathematical relationships used in the model — the objective function and the constraints — must be straight-line (first-degree) relationships. The word \"programming\" does not refer to computer programming; it refers to planning or the scheduling of activities to obtain an optimal result. LP models are widely applied in management science to problems such as product mix planning, production scheduling, workforce assignment, diet and blending problems, transportation and distribution planning, and financial portfolio selection.", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-1-2-components-of-an-lp-model", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "1.2 Components of an LP Model", "summary": "Core components are decision variables, objective function, constraints, and non-negativity restrictions. Parameters are the numerical coefficients used in the model.", "excerpt": "Every linear programming model, regardless of the business situation it represents, is built from three essential components:", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-1-3-steps-in-formulating-lp-models", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "1.3 Steps in Formulating LP Models", "summary": "Identify decision variables, state the objective, translate resource/requirement limits into constraints, add non-negativity conditions, and check whether the model reflects the real problem.", "excerpt": "Formulating an LP model from a word problem is a skill that improves with practice. Follow these five steps consistently: Read the problem carefully and identify the decision to be made — this tells you what the decision variables represent. Define the decision variables explicitly and precisely, including their units of measure (e.g., let x1 = number of units of Product A produced per week). Formulate the objective function by expressing the goal (profit, cost, revenue, time) as a linear combination of the decision variables, and state whether it is to be maximized or minimized. Formulate the constraints by translating every limitation mentioned in the problem (materials, labor, capacity, demand, budget) into a linear inequality or equation involving the decision variables. State the non-negativity restriction: all decision variables must be greater than or equal to zero, since negative production or negative usage has no physical meaning.", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-1-4-formulating-maximization-problems", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "1.4 Formulating Maximization Problems", "summary": "Maximization models typically maximize profit, contribution, output, or another benefit subject to limited resources.", "excerpt": "Maximization problems typically involve a firm trying to earn the greatest possible profit or revenue given limited resources such as raw materials, labor hours, or machine time. Study the sample word problem below. Step 1 — Define the decision variables: x₁ = number of tables produced per week x₂ = number of chairs produced per week Step 2 — Formulate the objective function: Step 3 — Formulate the constraints: Complete LP Model:", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-1-5-formulating-minimization-problems", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "1.5 Formulating Minimization Problems", "summary": "Minimization models seek the lowest cost, time, distance, or other undesirable quantity while meeting required constraints.", "excerpt": "Minimization problems typically involve meeting a set of minimum requirements (such as nutritional needs, quality standards, or delivery obligations) at the lowest possible cost. Study the sample word problem below. Step 1 — Define the decision variables: x₁ = kilograms of Feed A used per bag x₂ = kilograms of Feed B used per bag Step 2 — Formulate the objective function: Step 3 — Formulate the constraints: Complete LP Model: Note: these two sample models will be solved graphically in Lesson 2, so keep them handy for reference.", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-2-1-requirements-and-steps-of-the-graphical-method", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "2.1 Requirements and Steps of the Graphical Method", "summary": "The graphical method is mainly used for two-variable LPs. Plot constraints, identify the feasible region, locate corner points, and evaluate the objective function.", "excerpt": "The graphical method is the simplest way to solve a linear programming problem, but it works only when the model has exactly two decision variables, since the solution must be plotted on a two-dimensional (x₁, x₂) graph. For LP models with three or more decision variables, other methods such as the Simplex Method are used instead. Regardless of whether the problem is a maximization or a minimization problem, the graphical method always follows the same general procedure: Set up the coordinate plane with the decision variables (x₁ and x₂) as the two axes. Plot each constraint as a straight line by converting the inequality into an equation and finding its intercepts. Determine the feasible region — the area that satisfies all constraints simultaneously, including non-negativity. Identify the corner points (also called extreme points or vertices) of the feasible region. Evaluate the objective function at each corner point (Corner-Point Method), or use the Iso-Profit/Iso-Cost Line Method, to find the optimal solution.", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-2-2-the-corner-point-method", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "2.2 The Corner-Point Method", "summary": "For a linear objective over a polygonal feasible region, an optimum occurs at a corner point when a finite optimum exists. Evaluate the objective at feasible corners.", "excerpt": "The Corner-Point Method is based on an important theorem in linear programming: if an optimal solution exists, it will always occur at one of the corner points (vertices) of the feasible region — never strictly inside it. This means that instead of checking every possible point in the feasible region, we only need to evaluate the objective function at each corner point and select the best value. Let us solve Sample Problem 1 from Lesson 1 using the Corner-Point Method: Plotting the two constraint lines and shading the feasible region (the area satisfying both constraints and non-negativity) produces the graph below: Figure 1. Feasible region for the furniture-shop maximization problem, with corner points A, B, C, and D identified. The feasible region is bounded by four corner points: A(0, 0), B(20, 0), C(10, 20), and D(0, 25). Point C is found by solving the two constraint equations simultaneously (where the carpentry and finishing lines intersect): Now evaluate the objective function Z = 400x₁ + 300x₂ at each corner point:", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-2-3-the-iso-profit-iso-cost-line-method", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "2.3 The Iso-Profit / Iso-Cost Line Method", "summary": "Move a line representing a constant objective value in the improving direction until it reaches the last feasible point or edge.", "excerpt": "The Iso-Profit Line Method (called the Iso-Cost Line Method for minimization problems) is an alternative to evaluating every corner point individually. An iso-profit line is a line along which every combination of x₁ and x₂ produces the same total profit. By drawing several parallel iso-profit lines — each representing a different, increasing value of Z — and observing which one touches the feasible region at the point farthest from the origin, we can directly identify the optimal corner point without computing Z everywhere. Assign any convenient trial value to Z and plot that iso-profit line (e.g., Z = 400). Plot a second, larger value of Z, noting that all iso-profit lines for the same objective function are parallel to one another (they have the same slope). Slide the iso-profit line outward (away from the origin, for maximization) or inward (toward the origin, for minimization), keeping it parallel, until it touches the feasible region at the last possible point before leaving the region entirely.", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-2-4-solving-a-minimization-problem-graphically", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "2.4 Solving a Minimization Problem Graphically", "summary": "Graph constraints, identify the feasible region, determine candidate corner points, then choose the feasible point with the smallest objective value.", "excerpt": "The same graphical procedure applies to minimization problems, except that the feasible region is typically unbounded above/outward (since ≥ constraints push the region away from the origin), and the iso-cost line is slid inward, toward the origin, to find the minimum. Let us solve Sample Problem 2 from Lesson 1: Figure 3. Feasible region for the feed-blending minimization problem. Because both constraints are ≥, the feasible region extends upward and outward from the intersection of the two lines. The corner points of this feasible region are A(0, 9), B(2, 3), and C(8, 0), where B is found by solving the two constraint equations simultaneously:", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-2-5-sensitivity-range-ranging-analysis", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "2.5 Sensitivity Range (Ranging Analysis)", "summary": "Sensitivity analysis examines how changes in model parameters can affect the optimal solution without completely re-solving the model.", "excerpt": "Once an optimal solution has been found, decision-makers often want to know how much the situation could change before the optimal solution itself would change. Sensitivity analysis (also called ranging analysis) answers two key questions: Range of Optimality — how much can a coefficient in the objective function (e.g., unit profit or unit cost) change before the optimal corner point itself would change? Range of Feasibility — how much can the right-hand side of a constraint (e.g., available hours or budget) change while the same set of corner points remains binding, so the shadow price of that resource stays valid? Graphically, the range of optimality for an objective-function coefficient can be found by pivoting the iso-profit line at the current optimal corner point and finding the slope values at which the line would start favoring an adjacent corner point instead. For the furniture-shop problem (optimal at corner C, where the carpentry and finishing constraints intersect), the profit-per-table coefficient (currently ₱400) could range between the slope of the finishing-hours line and the slope of the carpentry-hours line before the optimal solution would shift to an adjacent co", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m2-2-6-special-cases-in-linear-programming", "subject": "AE 4 — Management Science", "module": "Module 2 — Linear Programming", "title": "2.6 Special Cases in Linear Programming", "summary": "Infeasibility means no feasible solution; unboundedness means the objective can improve without a finite limit; multiple optima occur when more than one feasible point gives the same optimal objective value.", "excerpt": "Not every LP problem produces a single, well-behaved optimal solution. Three special cases can occur, and a good analyst must be able to recognize each one from the graph. A. Infeasibility A problem is infeasible when there is no combination of decision variables that satisfies all the constraints simultaneously — that is, the constraints contradict one another and no feasible region exists at all. This often happens when a minimum requirement constraint and a maximum limit constraint cannot both be satisfied. Figure 4. The constraint x₁ + x₂ ≤ 4 and the constraint x₁ + x₂ ≥ 8 have no overlapping region — the problem has no feasible solution. B. Unboundedness A problem is unbounded when the feasible region extends infinitely in the direction that improves the objective function, so that Z can be increased (in a maximization problem) without limit. This usually signals that a real-world constraint was left out of the model when it was formulated — in practice, a truly unbounded profit is impossible, so an unbounded result is often a warning sign of a modeling error.", "source": "AE/AE4/AE4_Module2_Linear_Programming.docx"}, {"id": "ae4-m3-1-1-from-a-general-lp-model-to-standard-form", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "1.1 From a General LP Model to Standard Form", "summary": "Standard form prepares an LP for the Simplex Method by expressing constraints and variables in a consistent algebraic form, including slack, surplus, and artificial variables when required.", "excerpt": "A linear programming (LP) problem consists of a linear objective function to be maximized or minimized, subject to a set of linear constraints and non-negativity restrictions on the decision variables. Before the Simplex Method can be applied, the model must be written in standard form. Rules for Standard Form The objective function is stated as a maximization (a minimization problem can be converted by multiplying the objective by –1). Every constraint is written as an equation (=), not an inequality. Every variable, including those added for conversion, must be non-negative. The right-hand side (RHS) of every constraint must be non-negative; multiply the constraint by –1 (and flip the inequality) if needed. Converting Inequalities Slack and surplus variables represent unused resources or excess amounts and carry a zero coefficient in the objective function. Artificial variables have no physical meaning — they exist only to provide an initial feasible basic solution and must be driven out of the solution (forced to zero) by the time the optimal solution is reached; this is the purpose of the Big-M and Two-Phase methods discussed in Sections 1.4 and 1.5.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-1-2-the-simplex-tableau", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "1.2 The Simplex Tableau", "summary": "The tableau organizes coefficients, right-hand sides, basic variables, and the objective row so each iteration can be performed systematically.", "excerpt": "Once a problem is in standard form, its data are organized into a simplex tableau. Each iteration of the Simplex Method corresponds to moving from one basic feasible solution (a corner point of the feasible region) to an adjacent one that improves — or at least does not worsen — the objective function value. Tableau Components Basic variables (B): the variables currently in the solution (initially the slack/artificial variables). cⱼ row: the objective function coefficient of each variable. Constraint rows: the coefficients of each variable in each constraint, plus the RHS. zⱼ row: the value Σ (cʙ × column coefficient) for each variable — the amount Z would change per unit of that variable entering the basis. cⱼ – zⱼ row (the “index row”): used to test for optimality. For a maximization problem, the solution is optimal once every cⱼ – zⱼ ≤ 0.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-1-3-pivot-operations", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "1.3 Pivot Operations", "summary": "A pivot changes the basis by selecting an entering variable and a leaving variable, then using row operations to make the pivot column suitable for the new basic solution.", "excerpt": "Each Simplex iteration follows the same four steps: Test for optimality — examine the cⱼ – zⱼ row. If every entry is ≤ 0 (maximization case), the current solution is optimal; stop. Select the entering variable — choose the non-basic variable with the largest positive cⱼ – zⱼ value; its column is the pivot column. Select the leaving variable (minimum ratio test) — for each row with a positive entry in the pivot column, divide the RHS by that entry. The row with the smallest non-negative ratio determines the leaving (departing) variable; its intersection with the pivot column is the pivot element. Perform row operations (pivot) — (a) divide the pivot row by the pivot element so it becomes 1; (b) for every other row, subtract a multiple of the new pivot row so that all remaining entries in the pivot column become 0. Recompute the zⱼ and cⱼ – zⱼ rows and repeat from Step 1. Tip: A tie in the minimum ratio test signals a degenerate solution; a tie in choosing the entering variable can be broken arbitrarily without affecting the final optimal value.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-1-4-the-big-m-method", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "1.4 The Big-M Method", "summary": "The Big-M method introduces artificial variables and assigns a very large penalty to them in the objective function so the final solution removes artificial variables when a feasible optimum exists.", "excerpt": "When a constraint is of the ≥ or = type, the initial basic solution (all decision variables at zero) is not feasible, so artificial variables aᵢ are introduced to start the Simplex Method. Because artificial variables have no real meaning, they must be penalized so heavily in the objective function that the Simplex procedure drives them out of the basis (to zero) as soon as possible. Maximize: Z = Σ cⱼxⱼ – MΣaᵢ (Minimize: Z = Σ cⱼxⱼ + MΣaᵢ) M represents an arbitrarily large positive number. During the optimality test, terms involving M are compared first (M dominates any finite coefficient); a solution is not optimal so long as an artificial variable with a positive coefficient remains in the basis at a positive level. Steps Convert all constraints to standard form, adding slack, surplus, and artificial variables as required. Assign each artificial variable a cost of –M in the objective function (maximization) or +M (minimization). Solve using the normal Simplex pivot procedure, treating M as a very large constant when comparing cⱼ – zⱼ values.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-1-5-the-two-phase-method", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "1.5 The Two-Phase Method", "summary": "Phase I finds a feasible basis by minimizing the sum of artificial variables; Phase II optimizes the original objective using the feasible basis.", "excerpt": "The Two-Phase Method avoids working with the symbol M directly by splitting the solution process into two separate LP problems that share the same constraints. Phase 1 Replace the original objective function with a new objective: minimize the sum of all artificial variables, W = Σ aᵢ. Solve this auxiliary LP with the normal Simplex procedure. If the minimum value of W is 0, a feasible solution to the original problem has been found (all artificial variables are zero) and Phase 2 may begin. If the minimum W is greater than 0, the original problem has no feasible solution. Phase 2 Drop the artificial variables (and the Phase-1 objective row) from the tableau. Restore the original objective function coefficients for the remaining variables.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-2-1-the-concept-of-duality", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "2.1 The Concept of Duality", "summary": "Every LP has an associated dual problem. The primal and dual provide alternative views of the same optimization structure and have linked optimal objective values under standard conditions.", "excerpt": "Every LP problem (the primal) has an associated LP problem called its dual. The dual problem uses the same data as the primal but reorganizes them: the primal’s objective coefficients become the dual’s RHS values, the primal’s RHS values become the dual’s objective coefficients, and the roles of rows and columns are reversed (the constraint matrix is transposed). Solving either problem automatically yields the solution to the other.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-2-2-formulating-the-dual-problem", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "2.2 Formulating the Dual Problem", "summary": "Dual construction systematically switches the roles of constraints and variables, with coefficients, inequality directions, and objective orientation determined by the primal form.", "excerpt": "As a general rule: if the primal is a maximization problem with ≤ constraints, the dual is a minimization problem with ≥ constraints (and vice-versa). Each primal constraint corresponds to one dual variable, and each primal variable corresponds to one dual constraint. Example Primal: Maximize Z = 3x₁ + 5x₂, subject to x₁ ≤ 4, 2x₂ ≤ 12, 3x₁ + 2x₂ ≤ 18, x₁, x₂ ≥ 0. Dual: Minimize W = 4y₁ + 12y₂ + 18y₃, subject to y₁ + 3y₃ ≥ 3, 2y₂ + 2y₃ ≥ 5, y₁, y₂, y₃ ≥ 0. Each dual variable yᵢ corresponds to one primal resource constraint (y₁ to the x₁ ≤ 4 limit, y₂ to the 2x₂ ≤ 12 limit, and y₃ to the 3x₁ + 2x₂ ≤ 18 limit).", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-2-3-economic-interpretation-shadow-prices", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "2.3 Economic Interpretation: Shadow Prices", "summary": "A shadow price measures the marginal value of relaxing a binding resource constraint within the valid sensitivity range.", "excerpt": "The optimal value of each dual variable yᵢ is called the shadow price of the corresponding primal resource (constraint i). It measures the marginal value of that resource — the amount by which the optimal objective value Z would improve if the availability of that resource (its RHS, bᵢ) were increased by exactly one unit, holding everything else constant. Shadow price yᵢ* = ∂Z*/∂bᵢ A binding constraint (one satisfied as an equality at the optimum) typically has a positive shadow price — more of that resource would improve the objective. A non-binding (slack) constraint has a shadow price of zero — there is already unused capacity, so relaxing it further adds no value. In the worked example above, x₁ = 2 and x₂ = 6 at the optimum, so the first constraint (x₁ ≤ 4) is not binding — its shadow price is 0. The second and third constraints are binding, so their shadow prices are positive and can be read directly from the cⱼ – zⱼ row under the slack variable columns of the final primal tableau (with sign reversed): y₂* = 5/2 and y₃* = 1/3, matching the coefficients found under s₂ and s₃ in Section 1.3.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-2-4-right-hand-side-rhs-ranging", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "2.4 Right-Hand-Side (RHS) Ranging", "summary": "RHS sensitivity asks how much a constraint's resource availability can change while the current basis remains optimal.", "excerpt": "Because a shadow price is only valid over a limited range, sensitivity analysis identifies the range of feasibility — the interval within which a constraint’s RHS (bᵢ) can change while the shadow price remains valid and the current basis stays optimal (only the values of the basic variables change, not which variables are basic). How to Find the Range Locate the column of the changing constraint’s slack (or artificial) variable in the final optimal tableau; this column shows how each basic variable changes per unit increase in that RHS. For each basic variable row, compute the ratio (current RHS value) ÷ (entry in that slack column), separately for positive and negative entries. The maximum allowable increase in bᵢ is the smallest ratio among rows with a negative entry (in absolute value); the maximum allowable decrease is the smallest ratio among rows with a positive entry. Outside this range, one of the basic variables would be forced negative (infeasible), so a new Simplex solution — and possibly a different shadow price — would be required.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-2-5-objective-function-coefficient-ranging", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "2.5 Objective Function Coefficient Ranging", "summary": "Coefficient sensitivity determines the range over which objective coefficients can change without changing the current optimal basis.", "excerpt": "Similarly, the range of optimality is the interval within which an objective function coefficient cⱼ can change without altering the optimal basis (the set of variables that are basic, and their values, stay the same — only Z itself may change). For a basic variable’s coefficient: the allowable range is found from the ratios of the cⱼ – zⱼ row entries to the corresponding row entries of that variable’s row in the final tableau, again split by sign. For a non-basic variable’s coefficient: the coefficient can increase up to the point where its cⱼ – zⱼ value reaches zero (beyond that point it would be profitable to bring the variable into the basis); it can decrease without limit (for a maximization problem) since a smaller coefficient only makes it less attractive. Managerial use: RHS ranging tells a manager how much additional capacity is worth acquiring at the current shadow price. Objective-coefficient ranging tells a manager how much a price or cost can fluctuate (e.g., due to market changes) before the current production plan is no longer optimal.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-3-1-formulation-of-the-transportation-problem", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "3.1 Formulation of the Transportation Problem", "summary": "Transportation models allocate quantities from sources to destinations while minimizing shipping cost or optimizing another linear objective under supply and demand constraints.", "excerpt": "The transportation model is a special type of LP problem concerned with distributing a product from a number of sources (e.g., factories, warehouses), each with a fixed supply, to a number of destinations (e.g., retail outlets, customers), each with a fixed demand, at minimum total shipping cost. Minimize Z = Σᵢ Σⱼ cᵢⱼ xᵢⱼ subject to: Σⱼ xᵢⱼ = sᵢ (supply at source i), Σᵢ xᵢⱼ = dⱼ (demand at destination j), and xᵢⱼ ≥ 0, where cᵢⱼ is the cost of shipping one unit from source i to destination j. A problem is balanced when total supply equals total demand (Σsᵢ = Σdⱼ); this is required before the solution methods below can be applied directly. An unbalanced problem is made balanced by adding a dummy source (if demand exceeds supply) or a dummy destination (if supply exceeds demand) with zero shipping costs and a capacity/requirement equal to the shortfall. A feasible solution to a transportation problem with m sources and n destinations is basic when it has exactly m + n – 1 occupied (allocated) cells; fewer occupied cells indicate a degenerate solution.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-3-2-finding-an-initial-feasible-solution", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "3.2 Finding an Initial Feasible Solution", "summary": "An initial feasible transportation solution can be generated using methods such as Northwest Corner, Least Cost, or Vogel's Approximation Method.", "excerpt": "Three common methods construct a starting solution, which is then improved (if necessary) using the MODI method. All three begin with the full supply and demand table: (a) Northwest Corner Method The simplest method; it ignores costs entirely and focuses only on feasibility. Start at the top-left (northwest) cell of the table and allocate as much as possible — the smaller of that row’s remaining supply and that column’s remaining demand. Cross out the row or column that is now exhausted (if both are exhausted simultaneously, cross out only one to preserve the m + n – 1 cell count, leaving a zero allocation in the other). Move to the next cell to the right (if the column was exhausted) or down (if the row was exhausted) and repeat until all supply and demand are allocated. Because it ignores cost, the Northwest Corner Method is fast but usually produces a solution far from optimal, requiring more MODI iterations afterward. (b) Minimum Cost (Least Cost) Method", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae4-m3-3-3-the-modi-modified-distribution-method", "subject": "AE 4 — Management Science", "module": "Module 3 — Simplex, Duality, Sensitivity & Transportation", "title": "3.3 The MODI (Modified Distribution) Method", "summary": "MODI evaluates a transportation solution using row and column potentials and opportunity costs to determine whether an improvement is possible and to move toward optimality.", "excerpt": "After an initial feasible solution is obtained by any of the three methods above, the MODI method tests whether it is optimal and, if not, systematically improves it. Steps For the current basic feasible solution (m + n – 1 occupied cells), assign index values uᵢ (for each row/source) and vⱼ (for each column/destination) such that, for every occupied cell, cᵢⱼ = uᵢ + vⱼ. Since there is one more unknown than equation, one index (conventionally u₁) is set to 0 to solve the rest. For every unoccupied (non-basic) cell, compute the opportunity cost: dᵢⱼ = cᵢⱼ – (uᵢ + vⱼ). Optimality test: if every dᵢⱼ ≥ 0, the current solution is optimal — stop. If any dᵢⱼ is negative, the solution can be improved. Select the unoccupied cell with the most negative dᵢⱼ to enter the solution. Trace a closed loop of horizontal and vertical steps starting and ending at that cell, alternating + and – signs at each corner cell of the loop (corners must be currently-occupied cells). Let θ equal the smallest allocation found at a “–” corner of the loop. Add θ to allocations at “+” corners and subtract θ from allocations at “–” corners; the cell that reaches zero leaves the basis, and the new cell enters.", "source": "AE/AE4/AE4_Module3_Linear_Programming.docx"}, {"id": "ae11-m1-1-1-definition-of-managerial-economics", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "1.1 Definition of Managerial Economics", "summary": "Managerial Economics applies economic theory and quantitative methods to business and firm-level decision-making, especially decisions involving scarce resources, pricing, production, and strategy.", "excerpt": "Managerial Economics is the application of economic theory and methodology to business administration practice. It involves the use of economic tools and analytical frameworks to facilitate decision-making at the level of the firm. Several renowned economists have offered definitions: In essence, Managerial Economics combines: Economic theory (micro and macro) Decision science (statistics, mathematics, operations research) Business administration (finance, marketing, production, human resources)", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-1-2-nature-of-managerial-economics", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "1.2 Nature of Managerial Economics", "summary": "It is applied, decision-oriented, and interdisciplinary. It uses economic reasoning together with mathematics, statistics, accounting, finance, and management concepts.", "excerpt": "The following characteristics define the nature of Managerial Economics:", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-1-3-scope-of-managerial-economics", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "1.3 Scope of Managerial Economics", "summary": "The scope includes demand analysis, production and cost decisions, pricing, market structure, profit planning, risk, competition, and government policy affecting firms.", "excerpt": "The scope of Managerial Economics encompasses the following major decision areas: A. Demand Analysis and Forecasting Managers must understand consumer behavior and estimate demand to plan production and marketing strategies. Topics include: Law of Demand and demand elasticity Determinants of demand Demand forecasting techniques B. Production and Cost Analysis Efficient use of resources requires understanding production relationships and cost structures:", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-2-1-relationship-with-other-fields", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "2.1 Relationship with Other Fields", "summary": "Managerial economics connects economics with accounting, finance, statistics, mathematics, operations research, marketing, and management.", "excerpt": "Managerial Economics does not exist in isolation. It draws heavily from several disciplines, as illustrated below:", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-2-2-managerial-economics-vs-traditional-economics", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "2.2 Managerial Economics vs. Traditional Economics", "summary": "Traditional economics develops broader theories about consumers, firms, and economies; managerial economics applies relevant theory directly to practical business decisions.", "excerpt": "", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-3-1-meaning-of-profit", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "3.1 Meaning of Profit", "summary": "Profit is the return remaining after costs are considered. Economic profit differs from accounting profit because it recognizes opportunity costs.", "excerpt": "Profit is the financial return that remains after all costs (explicit and implicit) have been deducted from total revenue. In economics, we distinguish between: Accounting Profit: Total Revenue minus Explicit Costs (recorded expenses). Economic Profit: Total Revenue minus both Explicit Costs and Implicit Costs (opportunity costs). Normal Profit: The minimum return needed to keep a business in operation in the long run; included in economic costs. Supernormal (Economic) Profit: Profit above normal profit; signals success and attracts competitors.", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-3-2-theories-of-profit", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "3.2 Theories of Profit", "summary": "Profit can be explained through ideas such as risk-bearing, uncertainty, innovation, monopoly power, and dynamic change.", "excerpt": "Several theories explain the origin and nature of profit:", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-3-3-functions-of-profit", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "3.3 Functions of Profit", "summary": "Profit can reward innovation and risk-taking, signal efficient resource use, provide funds for growth, and motivate firms.", "excerpt": "Reward for entrepreneurship and risk-taking Signal for resource allocation — high profits attract investment to growing industries Source of investment funds for business expansion Indicator of managerial efficiency and organizational health Incentive for innovation and improved productivity", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-3-4-profit-maximization", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "3.4 Profit Maximization", "summary": "The traditional rule is to choose output where marginal revenue equals marginal cost (MR = MC), subject to the relevant conditions.", "excerpt": "The classical objective of a firm is to maximize profit. The profit maximization condition is:", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-3-5-alternative-objectives-of-the-firm", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "3.5 Alternative Objectives of the Firm", "summary": "Firms may also pursue sales growth, market share, managerial utility, survival, stakeholder goals, or satisfactory rather than maximum profit.", "excerpt": "Modern firms may pursue objectives beyond profit maximization:", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-4-1-definition-of-a-business-firm", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "4.1 Definition of a Business Firm", "summary": "A firm is an organization that combines resources to produce good
