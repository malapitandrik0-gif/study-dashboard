s or services and makes decisions about production, pricing, and resource use.", "excerpt": "A business firm is an economic organization that combines and coordinates productive resources (land, labor, capital, and entrepreneurship) for the purpose of producing goods or services to earn profit.", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-4-2-types-of-business-firms", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "4.2 Types of Business Firms", "summary": "Firms may be organized under different ownership structures, such as sole proprietorships, partnerships, corporations, and cooperatives.", "excerpt": "Business firms may be classified in several ways: A. By Legal Form of Organization B. By Size Micro, Small, and Medium Enterprises (MSMEs) – up to 200 employees Large Enterprises – more than 200 employees or capitalization above PHP 100 million C. By Industry/Sector Primary (agriculture, fishing, mining) Secondary (manufacturing, construction)", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-4-3-objectives-of-a-business-firm", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "4.3 Objectives of a Business Firm", "summary": "Objectives can include profit, growth, survival, market share, efficiency, innovation, and stakeholder-related goals.", "excerpt": "A business firm typically pursues the following objectives: Profit Maximization – achieving the highest possible net income Market Share Growth – expanding its customer base and revenue Survival and Continuity – sustaining operations through economic cycles Innovation – developing new products, processes, or markets Social Responsibility – contributing to community welfare and sustainability", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m1-4-4-the-firm-in-the-economic-system", "subject": "AE 11 — Managerial Economics", "module": "Module 1 — Introduction to Managerial Economics", "title": "4.4 The Firm in the Economic System", "summary": "Firms transform inputs into outputs and interact with households, markets, government, and other institutions through resource and product markets.", "excerpt": "In a market economy, the business firm plays the following roles: Producer of goods and services that satisfy consumer wants Employer of labor and user of capital and natural resources Taxpayer contributing to public revenue Innovator driving technological and economic progress Risk-taker bearing economic uncertainty to generate productive activity", "source": "AE/AE11/AE11_Module1_Managerial_Economics.docx"}, {"id": "ae11-m2-1-1-demand-supply-and-the-market-mechanism", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "1.1 Demand, Supply, and the Market Mechanism", "summary": "Demand describes quantities buyers are willing and able to buy; supply describes quantities sellers are willing and able to offer. Their interaction helps determine market price and quantity.", "excerpt": "Demand refers to the quantity of a good or service that consumers are willing and able to purchase at various prices, over a given period of time, holding all other factors constant. The Law of Demand states that, other things being equal, the quantity demanded of a good falls as its price rises, and rises as its price falls — producing a downward-sloping demand curve. Supply refers to the quantity of a good or service that producers are willing and able to offer for sale at various prices, over a given period of time. The Law of Supply states that, other things being equal, the quantity supplied of a good rises as its price rises — producing an upward-sloping supply curve. Besides price, demand is affected by non-price determinants such as consumer income, the prices of related goods (substitutes and complements), consumer tastes and preferences, expectations about future prices, and the number of buyers in the market. Likewise, supply is affected by non-price determinants such as input (production) costs, technology, the prices of related goods in production, taxes and subsidies, producer expectations, and the number of sellers. A change in a non-price determinant shifts the enti", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-1-2-elasticities-and-revenue-management", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "1.2 Elasticities and Revenue Management", "summary": "Elasticity measures responsiveness, such as percentage change in quantity divided by percentage change in price. Price elasticity helps managers anticipate revenue effects of price changes.", "excerpt": "Elasticity measures how responsive one economic variable is to a change in another. For managers, elasticity is one of the most practically important concepts in economics, because it directly informs pricing and revenue decisions. Price Elasticity of Demand (Ed). This measures the percentage change in quantity demanded resulting from a one-percent change in price. The Elasticity–Revenue Relationship. Total revenue (TR = Price × Quantity) responds differently to a price change depending on the elasticity of demand. This relationship is one of the most useful rules of thumb in managerial pricing: Other Key Elasticities. Income Elasticity of Demand — measures the responsiveness of quantity demanded to a change in consumer income. A positive value indicates a normal good; a negative value indicates an inferior good. Cross-Price Elasticity of Demand — measures the responsiveness of the quantity demanded of one good to a change in the price of another good. A positive value indicates the two goods are substitutes; a negative value indicates they are complements.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-1-3-government-intervention-price-controls-taxes-and-subsidies", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "1.3 Government Intervention: Price Controls, Taxes, and Subsidies", "summary": "Price ceilings can create shortages when binding; price floors can create surpluses when binding. Taxes create a wedge between buyer and seller prices, while subsidies encourage activity.", "excerpt": "Governments frequently intervene in markets to pursue social or economic policy goals. While well-intentioned, these interventions typically create predictable, and sometimes undesirable, side effects on market outcomes. Price Ceilings. A price ceiling is a legal maximum price that sellers may charge, typically imposed to keep essential goods (such as rent-controlled housing or basic commodities) affordable. A price ceiling has an effect only if it is set below the equilibrium price. When this happens, quantity demanded exceeds quantity supplied at the ceiling price, resulting in a persistent shortage, and often leading to rationing, long queues, or black markets. Figure 2. A price ceiling set below the equilibrium price creates a shortage, since quantity demanded exceeds quantity supplied at the controlled price. Price Floors. A price floor is a legal minimum price that buyers must pay, typically imposed to protect producers or workers (such as minimum wage laws or agricultural price supports). A price floor has an effect only if it is set above the equilibrium price. When this happens, quantity supplied exceeds quantity demanded at the floor price, resulting in a persistent surpl", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-2-1-consumer-preferences-and-utility-maximization", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "2.1 Consumer Preferences and Utility Maximization", "summary": "Consumers allocate limited income across goods to maximize satisfaction subject to a budget constraint. Marginal utility and marginal utility per peso are key decision concepts.", "excerpt": "Utility is the satisfaction or benefit a consumer derives from consuming a good or service. Economists use the concept of utility to model how consumers make choices, assuming that consumers act rationally to maximize their total utility given their limited income (budget). Indifference Curves. An indifference curve shows all the combinations of two goods that give a consumer the same level of total utility — the consumer is indifferent between any two bundles that lie on the same curve. Indifference curves are typically drawn as downward-sloping and convex to the origin, reflecting the principle of diminishing marginal rate of substitution: as a consumer gives up more and more of one good, they require increasingly larger amounts of the other good to remain equally satisfied. Curves farther from the origin represent higher levels of utility. The Budget Line. The budget line (or budget constraint) shows all the combinations of two goods that a consumer can afford to purchase, given their income and the prices of the two goods. It is expressed as:", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-2-2-market-demand-estimation", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "2.2 Market Demand Estimation", "summary": "Demand estimation uses economic theory and data to quantify how quantity demanded responds to price, income, advertising, competitor actions, and other determinants.", "excerpt": "While individual consumer theory explains the logic behind the downward-sloping demand curve, businesses need practical methods to estimate actual market demand for their products. Common approaches include: In practice, most firms combine several of these approaches — for example, using regression analysis on historical sales data to build a baseline demand estimate, then validating and refining it with test marketing or survey data before a major pricing or product launch decision.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-2-3-behavioral-economics", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "2.3 Behavioral Economics", "summary": "Behavioral economics incorporates psychological factors and systematic biases that can cause actual decisions to differ from the fully rational-agent model.", "excerpt": "Traditional (neoclassical) consumer theory assumes that individuals are fully rational and always act to maximize utility given complete information. Behavioral economics challenges this assumption by incorporating insights from psychology to explain systematic ways in which real consumers deviate from purely rational decision-making. Key concepts include: Activity 2: Consumer Behavior and Demand Estimation Instructions: Answer each item completely. Explain, using the equimarginal principle, why a consumer who is currently getting more marginal utility per peso from Good A than from Good B is not yet at a utility-maximizing bundle, and what adjustment they should make. A milk tea shop is planning to launch a new flavor. Recommend two specific demand-estimation methods it could use before the full launch, and briefly justify why each is appropriate for this situation. Identify one behavioral economics concept (other than the examples given in this module) that you have personally observed being used in a store, app, or advertisement in the Philippines, and explain how it likely influences consumer decisions.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-3-1-production-functions-and-efficiency", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "3.1 Production Functions and Efficiency", "summary": "A production function relates inputs to maximum attainable output. Managers analyze productivity and the efficient combination of labor, capital, and other inputs.", "excerpt": "A production function describes the technical (physical) relationship between the quantity of inputs used (such as labor and capital) and the maximum quantity of output that can be produced from those inputs, given the current state of technology. In its simplest form, with labor (L) as the only variable input: Total, Average, and Marginal Product. Figure 6. As labor input increases, total product (TP) eventually rises at a decreasing rate; marginal product (MP) rises, peaks, then falls — even turning negative — while average product (AP) rises then falls, always crossing MP at its own maximum point. The Law of Diminishing Marginal Returns. This law states that, as additional units of a variable input (e.g., labor) are added to a fixed input (e.g., a factory or machinery), the marginal product of the variable input will eventually decline. This is not a statement about poor-quality workers — it reflects the simple fact that, with a fixed amount of capital or space, each additional worker has progressively less capital to work with, so their individual contribution to output eventually shrinks.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-3-2-short-run-vs-long-run-costs", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "3.2 Short-Run vs. Long-Run Costs", "summary": "In the short run, at least one input is fixed; in the long run, all inputs can be varied. Cost curves and marginal cost guide production decisions.", "excerpt": "In managerial economics, the short run is defined as a period in which at least one input (typically capital, plant size, or equipment) is fixed and cannot be adjusted, while the long run is a period in which all inputs are variable, allowing the firm to adjust its entire scale of operations, including plant size. Short-Run Cost Concepts. Figure 7. Short-run cost curves: marginal cost (MC) intersects both average variable cost (AVC) and average total cost (ATC) at their minimum points; average fixed cost (AFC) declines continuously as output rises. Long-Run Costs. In the long run, since all inputs (including plant size) are variable, there is no distinction between fixed and variable costs — the firm can choose the plant size and input combination that produces any given output level at the lowest possible total cost. The long-run average cost (LRAC) curve is often described as an \"envelope\" of many possible short-run average cost (SRAC) curves, each corresponding to a different plant size; at each output level, the LRAC reflects the lowest SRAC achievable at that output.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-3-3-economies-of-scale", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "3.3 Economies of Scale", "summary": "Economies of scale occur when long-run average cost falls as output increases. Diseconomies occur when average cost rises after a certain scale.", "excerpt": "Economies of scale occur when a firm's long-run average cost falls as it increases its scale of output — larger plants or firms become more cost-efficient per unit produced. Common sources of economies of scale include specialization of labor, bulk purchasing discounts on inputs, spreading fixed costs (such as research and development or advertising) over a larger output, and more efficient use of large-scale, specialized equipment. Diseconomies of scale occur when long-run average cost rises as output continues to increase beyond a certain point — often due to the challenges of coordinating and managing a very large, complex organization, communication breakdowns, and bureaucratic inefficiencies. The point at which the long-run average cost curve reaches its lowest point — where economies of scale are fully exhausted but diseconomies have not yet set in — is called the minimum efficient scale (MES). This is the smallest scale of production at which a firm can achieve the lowest possible long-run average cost, and it has significant implications for how many firms an industry can efficiently support.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m2-3-4-the-principal-agent-problem", "subject": "AE 11 — Managerial Economics", "module": "Module 2 — Demand, Supply, Consumer Behavior & Costs", "title": "3.4 The Principal-Agent Problem", "summary": "The principal-agent problem arises when one party delegates work to another whose incentives or information may differ. Monitoring, contracts, incentives, and governance can reduce the problem.", "excerpt": "The principal-agent problem arises whenever one party (the principal) delegates decision-making authority or work to another party (the agent), but the agent's interests are not perfectly aligned with the principal's interests, and the principal cannot perfectly observe or verify the agent's actions. Classic examples include shareholders (principals) versus company managers (agents), business owners versus employees, and even patients (principals) versus doctors (agents). Why the Problem Arises. Information asymmetry: the agent typically has more information about their own effort, actions, or hidden characteristics than the principal does. Misaligned incentives: agents may prioritize their own goals (e.g., a manager's job security, personal compensation, or reduced workload) over the principal's goals (e.g., maximizing shareholder value). Moral hazard: once hired, an agent may take less care or exert less effort than promised, since the principal cannot perfectly monitor their behavior.", "source": "AE/AE11/AE11_Module2_Demand_Supply_Consumer_Behavior_Costs.docx"}, {"id": "ae11-m3-1-1-perfect-competition", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "1.1 Perfect Competition", "summary": "Perfect competition features many buyers and sellers, homogeneous products, free entry and exit, and firms that are price takers.", "excerpt": "A perfectly competitive market is characterized by a very large number of small buyers and sellers, a homogeneous (identical) product, freedom of entry and exit, and perfect information. Because no single firm is large enough to influence the market price, each firm is a \"price taker\" — it accepts the price set by the interaction of overall market demand and supply and can sell any quantity it wishes at that price. Firms face a horizontal (perfectly elastic) demand curve at the market price. Profit-maximizing output occurs where marginal cost (MC) equals marginal revenue (MR), and since price equals MR, this is where P = MC. In the short run, firms may earn economic profit or incur losses, but free entry and exit drive economic profit toward zero in the long run. A close Philippine approximation of perfect competition is the palay (unmilled rice) trading market in Nueva Ecija, where numerous small farmers sell a largely homogeneous product to numerous traders, and prices are heavily influenced by the prevailing National Food Authority (NFA) support price and prevailing market conditions rather than by any single farmer's output decision.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-1-2-monopoly", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "1.2 Monopoly", "summary": "A monopoly is a market with a single dominant seller protected by significant barriers to entry. The firm has market power and chooses output and price subject to demand.", "excerpt": "A monopoly exists when a single firm is the sole supplier of a product with no close substitutes, and entry by competitors is blocked by legal, technological, or economic barriers. Because the monopolist is the entire market, it faces the downward-sloping market demand curve directly, giving it the power to set price — though it is still constrained by the willingness of consumers to pay. Profit maximization still occurs where MR = MC, but because the demand curve slopes downward, the profit-maximizing price exceeds marginal cost (P > MC). Barriers to entry — such as economies of scale, control of essential inputs, patents and franchises, or government-granted exclusivity — allow the monopolist to sustain economic profit even in the long run. Monopoly power generally results in a higher price and lower output than would occur under perfect competition, creating a deadweight loss to society. In the Philippines, examples of legally sanctioned or naturally occurring monopolies include the Manila Electric Company (MERALCO) within its exclusive franchise area, and local water district utilities that operate as the sole provider of water distribution services in a given municipality, sub", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-1-3-monopolistic-competition", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "1.3 Monopolistic Competition", "summary": "Many firms sell differentiated products and entry is relatively easy. Firms have some pricing power because products are not identical.", "excerpt": "Monopolistic competition combines features of both perfect competition and monopoly: there are many firms and relatively easy entry and exit, as in perfect competition, but each firm sells a differentiated product — through branding, quality, location, or service — giving it a small degree of price-setting power, as in monopoly. Each firm faces a downward-sloping but relatively elastic demand curve because close substitutes exist. Firms compete on non-price dimensions such as product quality, packaging, customer service, and advertising, in addition to price. In the long run, easy entry drives economic profit toward zero, but firms typically operate with some excess capacity because they produce at a point where average cost is not fully minimized. Carinderias, coffee shops, and fast-casual restaurants along the streets of Cabanatuan City illustrate monopolistic competition well: many establishments compete for the same customers, but each carves out a niche through menu variety, ambiance, or reputation, allowing modest price differences to persist without driving customers away entirely.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-1-4-oligopoly-and-strategic-interactions", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "1.4 Oligopoly and Strategic Interactions", "summary": "An oligopoly has a small number of interdependent firms. Each firm's decision can affect rivals, so strategic behavior is central.", "excerpt": "An oligopoly is a market dominated by a small number of large firms whose decisions are interdependent — meaning each firm's pricing, output, and marketing decisions directly affect, and are affected by, the decisions of its rivals. This mutual interdependence is the defining feature that separates oligopoly from the other market structures and is the reason game theory becomes an indispensable tool for analyzing oligopolistic behavior. High barriers to entry — large capital requirements, economies of scale, or control of distribution networks — keep the number of competing firms small. Firms may compete aggressively (price wars) or may implicitly or explicitly coordinate (collusion or cartel behavior), though explicit collusion is illegal in the Philippines under the Philippine Competition Act (Republic Act No. 10667). Because rivals react to each other's decisions, oligopolists must anticipate competitor responses before acting — the essence of strategic interaction explored further in Lesson 2.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-2-1-nash-equilibrium", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "2.1 Nash Equilibrium", "summary": "A Nash equilibrium occurs when each player's strategy is a best response to the strategies of the others, so no player benefits from changing strategy alone.", "excerpt": "A Nash equilibrium is a situation in which each player in a game chooses the best possible strategy given the strategies chosen by all other players, such that no player can improve their own payoff by unilaterally changing strategy. It is the central solution concept used to predict the outcome of strategic interaction among competing firms. A payoff matrix summarizes the outcomes (profits) available to each player under every combination of strategy choices. A dominant strategy is one that yields a player the best payoff regardless of what the rival chooses; when both players have a dominant strategy, the resulting outcome is a Nash equilibrium. The classic \"prisoner's dilemma\" structure shows how individually rational choices (e.g., undercutting a rival's price) can lead both firms to a worse collective outcome than if they had cooperated — illustrating why tacit or explicit coordination is often tempting, even though it may be illegal. Figure 2. A payoff matrix for two competing jeepney operators choosing between a low-fare and a high-fare strategy. Both operators charging a low fare is the Nash equilibrium, even though both would profit more by jointly charging a high fare.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-2-2-price-discrimination", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "2.2 Price Discrimination", "summary": "Price discrimination means charging different prices for the same or similar product when differences are not fully explained by cost, often based on willingness to pay.", "excerpt": "Price discrimination is the practice of charging different prices to different customers or customer groups for the same or a similar product, where the price differences are not solely based on differences in production cost. Firms use price discrimination to capture consumer surplus that would otherwise be lost, thereby increasing total profit. First-degree (perfect) price discrimination charges each customer the maximum price they are willing to pay — rare in practice but approximated by negotiated pricing, such as haggling in a palengke (public market). Second-degree price discrimination charges different prices based on the quantity purchased, such as bulk discounts or tiered electricity rates. Third-degree price discrimination charges different prices to distinct, identifiable customer segments, such as student, senior citizen, or Person-with-Disability (PWD) discounts required under Philippine law (Republic Act No. 9994 and Republic Act No. 10754), or lower rates charged in less price-sensitive versus more price-sensitive markets.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-2-3-two-part-pricing", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "2.3 Two-Part Pricing", "summary": "A two-part tariff combines an entry or fixed fee with a per-unit charge to extract more consumer surplus under suitable conditions.", "excerpt": "Two-part pricing (or a two-part tariff) charges customers a fixed fee for the right to purchase a product or service, plus a separate per-unit price for each unit actually consumed. This strategy allows a firm to capture consumer surplus through the fixed fee while still pricing at or near marginal cost for each unit purchased, encouraging efficient consumption. Examples in the Philippine setting include gym or fitness club membership fees combined with per-session or per-class charges, and postpaid mobile or broadband plans that combine a fixed monthly fee with usage-based charges beyond a data allowance. The optimal fixed fee, in theory, approaches the consumer surplus of the marginal (least willing) customer the firm wishes to retain, while the per-unit price is set close to marginal cost to maximize the volume of profitable transactions.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-2-4-commodity-bundling", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "2.4 Commodity Bundling", "summary": "Bundling sells products together as a package. It can increase willingness to buy and improve revenue when consumer valuations differ across products.", "excerpt": "Commodity bundling is the practice of selling two or more distinct products together as a single package, often at a price lower than the sum of the products' individual prices. Bundling is profitable when customers have heterogeneous (varying) valuations for the individual products, because it reduces the dispersion of the combined valuation across customers, allowing the firm to capture more consumer surplus with a single bundle price. Pure bundling sells products only as a package (e.g., a fast-food value meal combining a burger, fries, and drink). Mixed bundling offers products both individually and as a discounted package, giving customers the choice while still nudging most toward the bundle (e.g., cable television or streaming subscription tiers, telecom postpaid plans that bundle calls, texts, and data).", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-2-5-peak-load-pricing", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "2.5 Peak-Load Pricing", "summary": "Peak-load pricing charges higher prices during periods of high demand or capacity pressure and lower prices during off-peak periods.", "excerpt": "Peak-load pricing charges a higher price during periods of high demand (peak periods) and a lower price during periods of low demand (off-peak periods), reflecting the higher marginal cost of serving customers when capacity constraints bind during peak periods. This strategy both improves profitability and helps smooth demand across time, reducing the need for costly excess capacity. Electricity distributors and generation companies in the Philippines apply time-of-use pricing, charging higher rates during peak demand hours (typically mid-afternoon to early evening) and lower rates overnight. Toll expressway operators, domestic airlines, and inter-island ferry operators similarly charge higher fares during peak travel periods such as Holy Week, Christmas season, and long weekends, and lower fares during off-peak periods. Self-Check Activity 2 Analyze each situation and identify which specific pricing strategy (price discrimination, two-part pricing, commodity bundling, or peak-load pricing) is being applied. Briefly explain your reasoning.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-3-1-economics-of-information", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "3.1 Economics of Information", "summary": "Information has economic value because better information can improve decisions and reduce uncertainty, but obtaining information can also be costly.", "excerpt": "Classical economic models often assume that all market participants have complete and accurate information about prices, product quality, and available alternatives. In reality, information is costly to obtain and is frequently distributed unevenly among buyers and sellers, leading to inefficient outcomes. The economics of information studies how imperfect information affects decision-making, market outcomes, and the value of acquiring additional information (the value of information). Search costs — the time and effort required to gather information on prices and quality — can allow firms to charge different prices for identical goods, even in competitive markets, a phenomenon economists call \"price dispersion.\" Consumers and firms rationally weigh the marginal benefit of acquiring more information against its marginal cost, meaning perfect information is rarely economically worthwhile to obtain.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-3-2-asymmetric-information", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "3.2 Asymmetric Information", "summary": "Asymmetric information occurs when one party has more relevant information than another. Common problems include adverse selection and moral hazard.", "excerpt": "Asymmetric information exists when one party to a transaction has more or better information than the other, and this imbalance can distort market outcomes in two principal ways: adverse selection and moral hazard. Adverse selection occurs before a transaction, when the party with less information cannot distinguish high-quality from low-quality options, potentially causing high-quality options to exit the market — the classic \"market for lemons\" problem, well illustrated by the used-vehicle (second-hand car) market, where sellers know a vehicle's true condition far better than prospective buyers. Moral hazard occurs after a transaction, when one party changes behavior because it no longer bears the full consequences of its actions, such as an insured individual taking less care to avoid a loss once insurance coverage is in place. Firms and regulators can mitigate asymmetric information through signaling (e.g., warranties, professional certifications, credit ratings), screening (e.g., requiring medical examinations before issuing life insurance), and reputation mechanisms (e.g., online seller ratings).", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-3-3-externalities-and-public-goods", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "3.3 Externalities and Public Goods", "summary": "Externalities are spillover effects on third parties. Public goods are generally non-rival and non-excludable, creating challenges for private provision.", "excerpt": "An externality is a cost or benefit of an economic activity that falls on a third party who did not choose to bear that cost or receive that benefit, and is therefore not reflected in the market price. Externalities cause the market outcome to diverge from the socially efficient outcome because private decision-makers consider only their own private costs and benefits, ignoring the spillover effects on others. A negative externality (e.g., factory pollution, traffic congestion, noise) causes marginal social cost (MSC) to exceed marginal private cost (MPC), leading the market to overproduce the good relative to the socially optimal level. A positive externality (e.g., vaccination, education, watershed reforestation) causes marginal social benefit (MSB) to exceed marginal private benefit, leading the market to underproduce the good relative to the socially optimal level. Common remedies include Pigouvian taxes and subsidies (taxing negative externalities, subsidizing positive ones), tradable pollution permits, direct regulation, and the assignment of clear property rights (as suggested by the Coase theorem, under which private bargaining can resolve externalities when transaction cos", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-4-1-government-regulation", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "4.1 Government Regulation", "summary": "Regulation can address market failures, consumer protection, competition, information problems, and external costs, but regulation also has costs and possible unintended effects.", "excerpt": "Government regulation refers to rules imposed by government agencies to control the behavior of firms in areas such as pricing, quality, safety, entry, and environmental impact. Regulation is typically justified on efficiency grounds (correcting market failures such as monopoly power, externalities, and asymmetric information) or on equity grounds (protecting vulnerable consumers). Economic regulation directly controls prices, output, or entry in industries characterized by natural monopoly, such as electricity distribution and water utilities, typically administered in the Philippines by agencies such as the Energy Regulatory Commission (ERC) and the National Water Resources Board (NWRB). Social regulation addresses externalities and information problems that cut across industries, such as environmental regulation enforced by the Department of Environment and Natural Resources (DENR), food and drug safety regulation by the Food and Drug Administration (FDA), and financial-sector regulation by the Bangko Sentral ng Pilipinas (BSP) and the Securities and Exchange Commission (SEC).", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-4-2-antitrust-policy", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "4.2 Antitrust Policy", "summary": "Antitrust policy seeks to protect competition by addressing conduct or structures that substantially harm competitive markets.", "excerpt": "Antitrust (competition) policy aims to preserve and promote competitive markets by prohibiting anti-competitive conduct such as price-fixing, market allocation, abuse of dominant position, and anti-competitive mergers. In the Philippines, the primary legal framework is the Philippine Competition Act (Republic Act No. 10667), enforced by the Philippine Competition Commission (PCC). Prohibited anti-competitive agreements include cartel behavior such as price-fixing, bid-rigging, and market or customer allocation among competitors. Abuse of dominant position occurs when a firm with substantial market power engages in conduct such as predatory pricing, exclusive dealing, or tying arrangements intended to exclude competitors or exploit consumers. Merger review requires firms engaging in mergers or acquisitions above certain transaction-value thresholds to notify the PCC, which may prohibit, condition, or allow the transaction depending on its likely effect on competition. Penalties under the Philippine Competition Act can include substantial administrative fines and, for the most serious violations, criminal liability for responsible corporate officers.", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae11-m3-4-3-role-of-accounting-in-regulatory-compliance", "subject": "AE 11 — Managerial Economics", "module": "Module 3 — Market Structure, Pricing, Information & Regulation", "title": "4.3 Role of Accounting in Regulatory Compliance", "summary": "Accounting systems support compliance by producing reliable records, disclosures, controls, and evidence needed for regulatory and governance requirements.", "excerpt": "Accountants and the accounting function play an indispensable role in helping organizations comply with government regulation and antitrust policy, making this an especially relevant topic for accountancy students preparing for professional practice. Accurate financial reporting and internal controls provide the documentary evidence regulators and competition authorities rely on to assess pricing behavior, cost structures, and potential predatory pricing or market allocation schemes. Cost accounting and transfer pricing documentation are essential in demonstrating that prices charged, especially in related-party or intercompany transactions, are justified by legitimate cost and market considerations rather than anti-competitive intent. Internal and external auditors help design and monitor compliance programs, including antitrust compliance policies, whistleblower mechanisms, and periodic risk assessments that reduce the likelihood of regulatory violations. Accountants preparing regulatory filings — such as rate applications submitted to the ERC by utility companies, or merger notification filings submitted to the PCC — must ensure that financial data disclosed is accurate, complet", "source": "AE/AE11/AE11_Module3_Managerial_Economics.docx"}, {"id": "ae12-m1-1-1-economic-development", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "title": "1.1 Economic Development", "summary": "Economic development is broader than increases in output. It includes improvements in living standards, health, education, capabilities, institutions, and opportunities.", "excerpt": "", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx"}, {"id": "ae12-m1-1-2-economic-growth", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "title": "1.2 Economic Growth", "summary": "Economic growth is an increase in the production of goods and services over time, commonly measured using real GDP or real GDP per capita.", "excerpt": "", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx"}, {"id": "ae12-m1-1-3-development-indicators-gdp-gni-per-capita-income", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "title": "1.3 Development Indicators: GDP, GNI & Per Capita Income", "summary": "GDP measures production within a country; GNI adjusts for net income from abroad; per-capita measures divide an aggregate by population and help compare average income.", "excerpt": "", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx"}, {"id": "ae12-m1-1-4-human-development-index-hdi", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "title": "1.4 Human Development Index (HDI)", "summary": "HDI summarizes key dimensions of human development, including health, education, and standard of living. It is broader than an income-only measure.", "excerpt": "", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx"}, {"id": "ae12-m1-1-5-inequality-and-the-gini-coefficient", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "title": "1.5 Inequality and the Gini Coefficient", "summary": "The Gini coefficient summarizes inequality, with higher values generally indicating greater inequality. The Lorenz curve provides a graphical representation of income distribution.", "excerpt": "", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx"}, {"id": "ae12-m1-1-6-sustainability-and-the-sdgs", "subject": "AE 12 — Economic Development", "module": "Module 1 — Concepts of Economic Development", "title": "1.6 Sustainability and the SDGs", "summary": "Sustainable development seeks to improve welfare while preserving the ability of future generations to meet their needs. The UN Sustainable Development Goals provide a global framework for development priorities.", "excerpt": "", "source": "AE/AE12/AE12_Module1_Lesson1_Economic_Development.docx"}, {"id": "ae12-m2-1-1-common-characteristics-of-developing-nations", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "1.1 Common Characteristics of Developing Nations", "summary": "Developing economies may face lower average incomes, structural transformation, infrastructure gaps, informal employment, inequality, institutional constraints, and limited access to productive opportunities.", "excerpt": "While developing nations differ enormously in history, culture, and resource endowments, development economists have identified a set of structural features that many of them share. Michael Todaro and Stephen Smith, in their influential text on economic development, classify developing countries along ten broad dimensions. In the Philippine context, several of these characteristics are readily observable: a large share of the labor force remains in low-productivity agriculture and informal services, income inequality remains high relative to regional neighbors, and the economy continues to depend heavily on remittances from overseas Filipino workers (OFWs) as an external income source — a modern variant of external dependence.", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m2-1-2-the-convergence-debate", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "1.2 The Convergence Debate", "summary": "Convergence asks whether poorer economies tend to catch up with richer economies. Conditional convergence emphasizes that countries converge toward their own steady states given differences in savings, population growth, technology, institutions, and human capital.", "excerpt": "The convergence hypothesis, rooted in the neoclassical (Solow) growth model, predicts that poorer countries should grow faster than richer ones because of diminishing returns to capital — each additional peso of investment yields a larger output gain in a capital-scarce economy than in a capital-abundant one. Over time, this should allow poor countries to \"catch up\" to rich ones, narrowing the international income gap. Economists distinguish between several versions of this hypothesis: Absolute (unconditional) convergence — all countries converge to the same steady-state income level regardless of their initial conditions or policies. Conditional convergence — countries converge only toward their own steady state, which is determined by their savings rates, population growth, human capital, and institutions; poor countries with weak fundamentals may never catch up. Club convergence — groups of countries with similar structural characteristics (for example, the East Asian economies) converge toward one another, even as gaps persist between clubs.", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m2-1-3-east-asian-miracle-vs-philippine-experience", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "1.3 East Asian Miracle vs. Philippine Experience", "summary": "East Asian high-growth economies are often associated with export orientation, investment in human capital, industrial policy, macroeconomic stability, and institutional capacity. The Philippine experience reflects a more uneven structural transformation and growth path.", "excerpt": "Few comparisons illustrate the conditional nature of convergence better than that between the newly industrialized economies (NIEs) of East Asia — South Korea, Taiwan, Hong Kong, and Singapore, later joined by Malaysia, Thailand, and Indonesia — and the Philippines. In the 1950s and 1960s, the Philippines was often regarded as one of the more promising economies in Asia, second only to Japan in parts of the region by some income measures. By the close of the twentieth century, however, the so-called East Asian Miracle economies had achieved sustained double-digit and high single-digit growth rates and dramatically higher living standards, while Philippine growth remained comparatively volatile and slower. Development economists point to several interacting explanations for this divergence: the East Asian economies combined outward-looking trade policy with credible macroeconomic management and effective, if imperfect, land reform, while political economy factors in the Philippines — including elite capture of policy and weaker implementation capacity — slowed the equivalent transformation. The Philippines has, since the 2000s, shown renewed growth momentum driven by business proces", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m2-2-1-rostow-s-stages-of-growth", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "2.1 Rostow's Stages of Growth", "summary": "Rostow describes development as stages: traditional society, preconditions for take-off, take-off, drive to maturity, and age of high mass consumption.", "excerpt": "Walt Whitman Rostow's 1960 model, The Stages of Economic Growth: A Non-Communist Manifesto, proposed that all countries pass through five linear stages on the path to modern industrial development. Rostow's model was historically influential in shaping post-war development aid strategy, notably underpinning the logic of the U.S. Marshall Plan approach applied to developing nations: if take-off required a savings-investment threshold, then foreign aid or capital inflows could fill the gap and trigger self-sustaining growth. Critique and Limitations The model assumes a single, universal linear path, ignoring the diverse historical, institutional, and geopolitical circumstances of individual countries. It treats capital accumulation as the binding constraint on growth, understating the roles of institutions, human capital, and technology. It offers little guidance on the specific policy mechanisms needed to trigger \"take-off,\" beyond raising the investment rate. Historically, several developing countries received substantial capital inflows without achieving sustained take-off, casting doubt on capital sufficiency as the key growth trigger.", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m2-2-2-harrod-domar-model", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "2.2 Harrod-Domar Model", "summary": "The Harrod-Domar framework links growth to savings and investment, emphasizing the role of capital accumulation and the capital-output relationship.", "excerpt": "Developed independently by Roy Harrod and Evsey Domar, the Harrod-Domar model formalizes the idea underlying Rostow's take-off stage: economic growth is a direct function of the savings rate and the productivity of capital investment. The model is often summarized by the growth equation: g = s / k where g is the rate of growth of national income (GDP growth rate), s is the national net savings ratio (savings as a share of national income), and k is the capital-output ratio (a measure of how much capital investment is required to produce one additional unit of output). The policy implication is direct: since developing countries typically have low domestic savings, closing the resulting \"savings gap\" through foreign aid, foreign direct investment, or borrowing should, in principle, accelerate growth by financing the investment that domestic savings alone cannot support. Critique and Limitations The model assumes capital is the only binding constraint on growth, ignoring land, labor quality, management capacity, technology, and institutional absorptive capacity.", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m2-2-3-structural-change-models", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "2.3 Structural-Change Models", "summary": "Structural-change approaches explain development through shifts from low-productivity traditional agriculture toward higher-productivity modern industry and services.", "excerpt": "Structural-change theory, associated with economists such as W. Arthur Lewis and Hollis Chenery, shifted the analytical focus from aggregate capital accumulation to the internal structural transformation of developing economies — specifically, the reallocation of labor and output from low-productivity traditional agriculture to higher-productivity modern industry and services. Rather than treating the economy as a single homogenous sector (as the Harrod-Domar model implicitly does), structural-change models divide the economy into at least two sectors with different productivity characteristics and analyze development as the gradual shift of resources between them. Chenery's empirical \"patterns of development\" research, in particular, documented common structural regularities across countries as per-capita income rises: declining agricultural share of output and employment, rising industrial and urbanization shares, changing composition of demand, and evolving trade and fiscal structures.", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m2-2-4-lewis-two-sector-model", "subject": "AE 12 — Economic Development", "module": "Module 2 — Comparative Development & Classic Theories", "title": "2.4 Lewis Two-Sector Model", "summary": "The Lewis model describes a traditional rural sector with surplus labor and a modern capitalist sector that absorbs labor as development proceeds, with capital accumulation supporting expansion.", "excerpt": "The most influential structural-change model is Sir W. Arthur Lewis's 1954 dual-sector model, for which Lewis was later awarded the Nobel Memorial Prize in Economic Sciences. The model divides the developing economy into two sectors: Because the traditional sector has surplus labor with near-zero marginal product, the modern sector can draw workers away from agriculture at a roughly constant wage without significantly reducing agricultural output. The capitalists in the modern sector reinvest their profits, expanding the capital stock and industrial employment further. This process continues — labor migrating from agriculture to industry, profits being reinvested — until the surplus labor in agriculture is fully absorbed. At that point, known as the \"Lewis turning point,\" agricultural marginal productivity rises above the subsistence wage, wages across the whole economy begin to rise together, and the dual economy converges into a single integrated labor market. Critique and Limitations", "source": "AE/AE12/AE12_Module2_Comparative_Development_Classic_Theories.docx"}, {"id": "ae12-m3-1-1-lorenz-curve-and-gini-coefficient", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "1.1 Lorenz Curve and Gini Coefficient", "summary": "The Lorenz curve compares cumulative population shares with cumulative income shares. The Gini coefficient summarizes the degree of inequality represented by the distribution.", "excerpt": "", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae12-m3-1-2-poverty-and-social-welfare", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "1.2 Poverty and Social Welfare", "summary": "Poverty involves inadequate resources or capabilities to meet basic needs. Analysis distinguishes absolute/poverty-line approaches from broader measures of deprivation and social welfare.", "excerpt": "Inequality and poverty are related but distinct concepts. A society can become more equal while everyone remains poor, or it can become richer on average while poverty persists among a subset of the population. Development economists therefore measure poverty separately from inequality. Defining and Measuring Poverty Absolute Poverty: a condition in which a household's income or consumption falls below a fixed threshold — a poverty line — considered necessary to meet basic needs such as food, shelter, and clothing, regardless of how others in society are faring. Relative Poverty: a condition in which a household's income falls significantly below the average or median income of the society in which it lives, even if its absolute standard of living would be considered adequate elsewhere. The Philippine Statistics Authority computes an official poverty threshold — the minimum income required to meet both food and non-food basic needs — and a separate, lower food (subsistence) threshold. Households whose income falls below the food threshold are classified as food-poor, a more severe form of deprivation than income poverty alone.", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae12-m3-2-1-the-demographic-transition", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "2.1 The Demographic Transition", "summary": "The demographic transition describes movement from high birth and death rates toward lower birth and death rates as development, health, education, and urbanization change.", "excerpt": "Demographic Transition: the historical shift of a population from a pattern of high birth rates and high death rates to a pattern of low birth rates and low death rates, typically accompanying industrialization and rising living standards. The demographic transition model, developed by demographers observing the historical experience of industrializing Europe, describes population change as passing through five broad stages: Figure 2.1. The Demographic Transition Model, illustrating the gap between crude birth and death rates across the five stages. In Stage 1, both birth and death rates are high, producing slow and volatile population growth — the historical condition of most pre-industrial societies, including the pre-colonial and early colonial Philippines. In Stage 2, death rates begin to fall sharply due to improvements in sanitation, nutrition, and basic health care, while birth rates remain high, producing rapid population growth — a pattern still visible in the least developed economies today. In Stage 3, birth rates begin to fall as urbanization, female education, and access to family planning expand, narrowing the gap between births and deaths. In Stage 4, both rates stab", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae12-m3-2-2-population-growth-and-economic-development", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "2.2 Population Growth and Economic Development", "summary": "Population growth can expand labor supply and markets, but rapid growth can also strain education, health, infrastructure, jobs, and natural resources when productive capacity lags.", "excerpt": "The relationship between population growth and economic development has long divided economists. Three broad perspectives are useful to distinguish: Malthusian / Pessimist View: population growth, if unchecked, outpaces the growth of food and resources, driving down living standards until checked by famine, disease, or war (associated with Thomas Malthus). Revisionist / Optimist View: population growth can stimulate innovation, expand the labor force and market size, and drive economies of scale, provided institutions and investment keep pace (associated with economists such as Julian Simon and Ester Boserup). Neutralist View: population growth is neither uniformly harmful nor uniformly beneficial; its effect on development depends on complementary factors such as the quality of institutions, the rate of human and physical capital accumulation, and labor market absorption capacity. The Demographic Dividend Demographic Dividend: the potential boost to economic growth that occurs when the working-age share of the population rises relative to dependents (children and the elderly), provided the additional workers are productively employed.", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae12-m3-2-3-the-o-ring-theory-of-economic-development", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "2.3 The O-Ring Theory of Economic Development", "summary": "The O-Ring model emphasizes that production tasks can be strongly complementary: a failure in one critical task can reduce the value of the entire production process, making skills and matching important.", "excerpt": "", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae12-m3-3-1-health-and-education-as-integrated-investments", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "3.1 Health and Education as Integrated Investments", "summary": "Health and education build human capital, raise productivity, expand capabilities, and can reinforce one another over the life cycle.", "excerpt": "Human Capital: the stock of skills, knowledge, health, and experience embodied in a population's workforce, which — like physical capital — can be built up through investment and which raises the productivity of labor. Health and education are frequently analyzed as separate sectors in national budgets and ministries, yet development economics increasingly treats them as integrated investments: each strengthens the returns to the other, and neglecting either weakens the returns to spending on both. How Health Reinforces Education Malnourished or chronically ill children have measurably lower cognitive development and school attendance; conditions such as stunting in early childhood are associated with reduced educational attainment and lower lifetime earnings even decades later. Parasitic infections, poor eyesight, and preventable illness are leading causes of absenteeism in Philippine public schools, particularly in low-income and rural communities — meaning school-based deworming and feeding programs function simultaneously as health and education interventions.", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae12-m3-3-2-gender-gap-in-development", "subject": "AE 12 — Economic Development", "module": "Module 3 — Poverty, Inequality, Population & Human Capital", "title": "3.2 Gender Gap in Development", "summary": "Gender gaps in education, health, labor-force participation, earnings, assets, and decision-making can reduce economic potential. Closing gaps can improve both equity and productivity.", "excerpt": "", "source": "AE/AE12/AE12_Module3_Poverty_Demographics_HumanCapital.docx"}, {"id": "ae10-u1-chapter-1-introduction-to-corporate-governance", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit I — Corporate Governance (Chapters 1–4)", "title": "Chapter 1 — Introduction to Corporate Governance", "summary": "Corporate governance concerns how organizations are directed and controlled. Core ideas include accountability, transparency, responsibility, fairness, stakeholder interests, and effective oversight.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u1-chapter-2-governance-responsibilities-and-accountabilities", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit I — Corporate Governance (Chapters 1–4)", "title": "Chapter 2 — Governance Responsibilities and Accountabilities", "summary": "Boards, management, shareholders, and other stakeholders have distinct responsibilities. Good governance requires clear roles, oversight, accountability, and mechanisms for addressing conflicts of interest.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u1-chapter-3-sec-code-of-corporate-governance-for-publicly-listed-companies", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit I — Corporate Governance (Chapters 1–4)", "title": "Chapter 3 — SEC Code of Corporate Governance for Publicly-Listed Companies", "summary": "The SEC governance framework emphasizes board responsibility, disclosure, transparency, risk oversight, shareholder rights, and systems that support ethical and accountable corporate management.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u1-chapter-4-sec-code-of-corporate-governance-continued", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit I — Corporate Governance (Chapters 1–4)", "title": "Chapter 4 — SEC Code of Corporate Governance, Continued", "summary": "Continued governance guidance focuses on board practices, committees, control and risk systems, disclosures, stakeholder relations, and accountability mechanisms.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u2-chapter-5-introduction-to-ethics", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "title": "Chapter 5 — Introduction to Ethics", "summary": "Ethics concerns principles used to judge right and wrong conduct. Ethical reasoning helps individuals and organizations evaluate decisions beyond legality or short-term self-interest.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u2-chapter-6-business-ethics", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "title": "Chapter 6 — Business Ethics", "summary": "Business ethics applies ethical principles to business decisions, relationships, policies, and organizational conduct. It connects values with responsible business practice.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u2-chapter-7-common-unethical-practices-of-business-establishments", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "title": "Chapter 7 — Common Unethical Practices of Business Establishments", "summary": "Unethical practices may include fraud, corruption, misleading conduct, conflicts of interest, abuse of authority, and other actions that violate trust or professional standards.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u2-chapter-8-ethical-dilemma", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "title": "Chapter 8 — Ethical Dilemma", "summary": "An ethical dilemma occurs when important values, duties, or interests conflict. A structured approach identifies stakeholders, facts, alternatives, consequences, and ethical principles before deciding.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u2-chapter-9-advocacy-against-corruption", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "title": "Chapter 9 — Advocacy Against Corruption", "summary": "Anti-corruption advocacy promotes integrity, transparency, accountability, reporting mechanisms, and organizational cultures that discourage bribery and abuse of power.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}, {"id": "ae10-u2-chapter-10-initiatives-to-improve-business-ethics-and-reduce-corruption", "subject": "AE 10 — Corporate Governance, Business Ethics, Risk Management & Internal Control", "module": "Unit II — Business Ethics (Chapters 5–10)", "title": "Chapter 10 — Initiatives to Improve Business Ethics and Reduce Corruption", "summary": "Organizations can improve ethics through codes of conduct, leadership example, training, whistleblowing channels, internal controls, monitoring, sanctions, transparency, and continuous evaluation.", "excerpt": "", "source": "AE/AE10/AE-10-chapter-1-5.docx"}], "reviewers": [{"name": "AE 4 — Management Science Exam Reviewer", "source": "AE/AE4/AE4_Management_Science_Exam_Reviewer.docx", "preview": "Prepared from the uploaded AE 4 Modules 2 and 3 How to Use This Reviewer This reviewer condenses the source modules into an exam-focused format. It preserves the terminology, procedures, and framing used in the uploaded materials. Use the “Must Memorize” boxes for quick recall, then practice the step-by-step procedures for computational questions. MODULE 2 — LINEAR PROGRAMMING Module 2 covers model formulation and the graphical solution method, including maximization and minimization, sensitivity range, infeasibility, unboundedness, and multiple optimal solutions. 1. What Is Linear Programming? Linear Programming (LP) is a mathematical technique for determining the optimal allocation of limited resources among competing activities, usually to maximize an objective such as profit or minimize an objective such as cost. “Linear” means the objective function and constraints are first-degree/straight-line relationships."}, {"name": "AE 10 — Corporate Governance & Business Ethics Exam Reviewer", "source": "AE/AE4/AE10_Corporate_Governance_Business_Ethics_Exam_Reviewer.docx", "preview": "Based on the uploaded Student Learning Modules Chapter 1–10 — Quick Coverage Map Chapter 1 — Introduction to Corporate Governance Governance Governance — The process of decision-making and the process by which decisions are implemented (or not implemented) through the exercise of power or authority by leaders of a country and/or organizations. Contexts of governance — Corporate, international, national, and local governance. Eight Characteristics of Good Governance"}, {"name": "AE 11 — Managerial Economics Exam Reviewer", "source": "AE/AE4/AE11_Managerial_Economics_Exam_Reviewer.docx", "preview": "Clean, exam-focused summary with definitions, formulas, comparisons, and high-yield recall points. MODULE 1 — INTRODUCTION TO MANAGERIAL ECONOMICS MUST KNOW: Managerial Economics = application of economic theory and methodology to business administration and firm-level decision-making. The module frames Managerial Economics as a bridge between economic theory and practical management decisions involving resource allocation, pricing, production, cost management, and competition. 1. Nature and Scope 2. Scope of Managerial Economics Demand analysis and forecasting — demand, elasticity, determinants, forecasting."}], "quiz": [{"n": 1, "answer": "B", "explanation": "Governance is the process through which elements in society use power and authority to make policies concerning public life."}, {"n": 2, "answer": "C", "explanation": "Transparency"}, {"n": 3, "answer": "B", "explanation": "Rule of Law"}, {"n": 4, "answer": "B", "explanation": "Corporate governance is the system of rules, practices, and processes by which corporations are directed and controlled."}, {"n": 5, "answer": "C", "explanation": "To enhance shareholders' value while protecting the interests of other stakeholders through better performance and accountability."}, {"n": 6, "answer": "C", "explanation": "Maximizing the personal wealth of executives"}, {"n": 7, "answer": "B", "explanation": "Transparency and Full Disclosure, Accountability, and Corporate Control"}, {"n": 8, "answer": "B", "explanation": "The shareholders/owners of the corporation"}, {"n": 9, "answer": "C", "explanation": "Internal Auditors"}, {"n": 10, "answer": "B", "explanation": "To provide oversight of internal and external audit functions and the preparation of annual financial statements."}, {"n": 11, "answer": "B", "explanation": "November 10, 2016"}, {"n": 12, "answer": "B", "explanation": "Companies may comply with the Code or explain why they do not comply with particular provisions."}, {"n": 13, "answer": "C", "explanation": "The company should have a strong and effective internal control system and enterprise risk management framework."}, {"n": 14, "answer": "C", "explanation": "Principle 6"}, {"n": 15, "answer": "B", "explanation": "Allow the board and management to move the organization forward within a framework of effective accountability."}, {"n": 1, "answer": "B", "explanation": "A set of moral principles or values that govern the actions and decisions of an individual or group"}, {"n": 2, "answer": "C", "explanation": "Integrity"}, {"n": 3, "answer": "B", "explanation": "The person's ethical standards are different from those of society as a whole"}, {"n": 4, "answer": "B", "explanation": "Help businesses determine what business practices are right and what are wrong"}, {"n": 5, "answer": "B", "explanation": "Standards of moral conduct, behavior, and judgment in business"}, {"n": 6, "answer": "B", "explanation": "Actively misrepresenting information about the product or customers"}, {"n": 7, "answer": "C", "explanation": "Indirect misrepresentation"}, {"n": 8, "answer": "C", "explanation": "Caveat emptor"}, {"n": 9, "answer": "B", "explanation": "A situation where a person must decide what the appropriate behavior is"}, {"n": 10, "answer": "C", "explanation": "Obtain the relevant facts"}], "stats": {"subjects": 4, "topics": 106, "source_docs": 18}};
const STORAGE="studyos-progress-v1";
let state=JSON.parse(localStorage.getItem(STORAGE)||'{}');
let currentView="dashboard", currentTopic=null;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function isDone(id){return !!state[id]}
function pct(arr){return arr.length?Math.round(arr.filter(t=>isDone(t.id)).length/arr.length*100):0}
function allTopics(){return DATA.topics}
function topicById(id){return DATA.topics.find(x=>x.id===id)}
function setView(v){currentView=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("#search").oninput=()=>render();

function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(currentView==="dashboard") dashboard(q);
  if(currentView==="subjects") subjects(q);
  if(currentView==="reviewers") reviewers();
  if(currentView==="quiz") quizView();
  if(currentView==="resources") resources();
}
function header(kicker,title,sub){
 return `<div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p>`;
}
function dashboard(q){
 const ts=allTopics(), done=ts.filter(t=>isDone(t.id)).length;
 const groups=[...new Set(ts.map(t=>t.subject))];
 let html=header("Overview","Your study command center",`Track what you have studied, open topic reviewers, and test yourself. Everything is saved locally in this browser.`);
 html+=`<div class="grid">
 <div class="stat"><b>${done}/${ts.length}</b><small>topics completed</small></div>
 <div class="stat"><b>${pct(ts)}%</b><small>overall progress</small></div>
 <div class="stat"><b>${groups.length}</b><small>subjects</small></div>
 <div class="stat"><b>${DATA.stats.source_docs}</b><small>source documents loaded</small></div></div>`;
 html+=`<h2>Subject progress</h2><div class="cards">`;
 groups.forEach(s=>{
   const a=ts.filter(t=>t.subject===s); html+=`<div class="card"><h3>${s}</h3><div class="bar-row"><span>${a.filter(t=>isDone(t.id)).length} of ${a.length}</span><span>${pct(a)}%</span></div><div class="progress"><i style="width:${pct(a)}%"></i></div><br><button class="btn ghost small" onclick='setView("subjects"); setTimeout(()=>{ $("#subjectFilter").value=${JSON.stringify(s)}; render();},0)'>Open topics</button></div>`;
 });
 html+=`</div><br><h2>Continue reviewing</h2><div class="cards">`;
 ts.filter(t=>!isDone(t.id)).slice(0,6).forEach(t=>html+=topicCard(t));
 if(!ts.some(t=>!isDone(t.id))) html+=`<div class="empty">Everything is marked complete. Nice work.</div>`;
 html+=`</div>`;
 $("#content").innerHTML=html;
}
function topicCard(t){
 return `<div class="card"><span class="tag">${t.subject.split("—")[0].trim()}</span><span class="tag">${t.module.split("—")[0]}</span><h3>${t.title}</h3><p>${t.summary}</p><button class="btn small" onclick='openTopic(${JSON.stringify(t.id)})'>Study topic</button></div>`;
}
function subjects(q){
 const subjects=[...new Set(DATA.topics.map(t=>t.subject))];
 let filtered=DATA.topics.filter(t=>!q || (t.title+" "+t.summary+" "+t.subject+" "+t.module).toLowerCase().includes(q));
 let html=header("Library","Subjects & topics",`${DATA.topics.length} trackable topics. Mark a topic complete only when you can explain the core idea or solve the required problem.`);
 html+=`<div class="toolbar"><select id="subjectFilter" onchange="render()"><option value="">All subjects</option>${subjects.map(s=>`<option>${s}</option>`).join("")}</select><button class="btn ghost small" onclick="clearProgress()">Reset progress</button></div>`;
 const sel=$("#subjectFilter")?.value||"";
 if(sel) filtered=filtered.filter(t=>t.subject===sel);
 html+=`<div class="topic-list">`;
 filtered.forEach(t=>html+=`<div class="topic ${isDone(t.id)?"done":""}"><input class="check" type="checkbox" ${isDone(t.id)?"checked":""} onchange='toggleDone(${JSON.stringify(t.id)})'><div><div class="title">${t.title}</div><div class="meta">${t.subject} · ${t.module}</div></div><div class="topic-actions"><button class="btn ghost small" onclick='openTopic(${JSON.stringify(t.id)})'>Review</button></div></div>`);
 if(!filtered.length) html+=`<div class="empty">No matching topics.</div>`;
 html+=`</div>`;
 $("#content").innerHTML=html;
 if(sel) $("#subjectFilter").value=sel;
}
function toggleDone(id){state[id]=!state[id]; if(!state[id]) delete state[id]; save(); render()}
function clearProgress(){if(confirm("Reset all topic progress?")){state={};save();render()}}
function openTopic(id){
 currentTopic=id; const t=topicById(id); currentView="topic"; document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 const text=t.excerpt||"The supplied module does not have a clean text excerpt for this heading; use the source document in Resources.";
 $("#content").innerHTML=`<div class="detail">
 <div class="detail-header"><div><div class="eyebrow">${t.subject}</div><h1>${t.title}</h1><p class="sub">${t.module}</p></div><button class="btn ${isDone(t.id)?"ghost":""}" onclick='toggleDone(${JSON.stringify(t.id)})'>${isDone(t.id)?"✓ Completed":"Mark complete"}</button></div>
 <div class="box"><h2>Quick summary</h2><p>${t.summary}</p></div>
 <div class="box"><h2>Exam reviewer</h2><ul><li><b>Core idea:</b> ${t.summary}</li><li><b>What to remember:</b> Identify the definition, purpose, key relationships, and any conditions or exceptions.</li><li><b>Active recall:</b> Close this page and explain the topic in your own words in 30–60 seconds.</li></ul></div>
 <div class="box"><h2>Module notes</h2><p>${text}</p></div>
 <div class="box"><h2>Study checklist</h2><label><input type="checkbox"> I can define the key term(s).</label><br><label><input type="checkbox"> I can explain the concept without notes.</label><br><label><input type="checkbox"> I can answer a basic exam question about it.</label><br><label><input type="checkbox"> I know the formula/procedure if this is computational.</label></div>
 <div class="box"><h2>Source</h2><p><a href="materials/${encodeURIComponent(t.source.split("/").pop())}" target="_blank">Open source module: ${t.source.split("/").pop()}</a></p></div>
 <br><button class="btn ghost" onclick='setView("subjects")'>← Back to topics</button>
 </div>`;
}
function reviewers(){
 let html=header("Exam prep","Reviewers",`Your supplied folder already contains exam-review documents for AE 4, AE 10 and AE 11. They are linked below, with the topic tracker alongside them.`);
 html+=`<div class="cards">`;
 DATA.reviewers.forEach(r=>html+=`<div class="card"><span class="tag">EXAM REVIEWER</span><h3>${r.name}</h3><p>${r.preview}</p><a class="btn small" href="materials/${encodeURIComponent(r.source.split("/").pop())}" target="_blank">Open reviewer</a></div>`);
 html+=`</div><br><h2>How to use</h2><div class="card"><p>1. Read the Quick Summary for a topic. 2. Open the supplied reviewer when available. 3. Use the Module Notes to fill gaps. 4. Mark the topic complete only after active recall. 5. Use Quiz Mode to test retention.</p></div>`;
 $("#content").innerHTML=html;
}
function quizView(){
 let html=header("Active recall","Quiz mode",`Questions below are drawn from the supplied answered student-version quiz. Select an answer to reveal the stored answer/explanation.`);
 html+=`<div class="toolbar"><button class="btn" onclick="location.reload()">Reset quiz</button></div><div id="quizArea">`;
 DATA.quiz.slice(0,20).forEach((q,i)=>{
  html+=`<div class="quiz-q"><p>${i+1}. ${q.explanation.replace(/^.*?–\s*/,"")}</p><div><button class="option" onclick='answerQ(this,${JSON.stringify(q.answer)})'>A</button><button class="option" onclick='answerQ(this,${JSON.stringify(q.answer)})'>B</button><button class="option" onclick='answerQ(this,${JSON.stringify(q.answer)})'>C</button><button class="option" onclick='answerQ(this,${JSON.stringify(q.answer)})'>D</button></div><small class="meta">Answer key is from the supplied answered quiz.</small></div>`;
 });
 html+=`</div>`; $("#content").innerHTML=html;
}
function answerQ(btn,ans){btn.parentElement.querySelectorAll(".option").forEach(b=>{b.disabled=true;b.classList.toggle("correct",b.textContent===ans)}); if(btn.textContent!==ans)btn.classList.add("wrong")}
function resources(){
 let html=header("Sources","Resources",`All source documents from the uploaded folder are bundled with this site. Open a document when you want the full module, activities, quiz, or exam reviewer.`);
 const bySubject={}; DATA.topics.forEach(t=>(bySubject[t.subject]??=new Set()).add(t.source.split("/").pop()));
 Object.entries(bySubject).forEach(([s,set])=>{html+=`<h2>${s}</h2><div class="cards">`; [...set].forEach(f=>html+=`<div class="card"><h3>${f}</h3><p>Source material used by the topic tracker and reviewer summaries.</p><a class="btn ghost small" href="materials/${encodeURIComponent(f)}" target="_blank">Open document</a></div>`); html+=`</div><br>`});
 $("#content").innerHTML=html;
}
function closeModal(){ $("#modal").classList.remove("open") }
render();
</script>
</body></html>
